# gitleaks configuration for the desktop (agentry-desktop#128). The CI job
# `gitleaks` scans every pull request's commits and every push with it.
# The default rules apply and nothing is allowlisted: a full-history scan was
# clean when this file was added (131 commits, 2026-09-24). A false positive
# gets a narrow entry here naming the one file (or a regex target), with the
# reason beside it; never a whole tree.
[extend]
useDefault = true
