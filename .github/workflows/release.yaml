# A release of the desktop client is a pushed tag, v<productVersion> on a
# commit that has been the head of main (a production release) or
# v<productVersion>-dev.N on one that has been the head of dev (a dev
# prerelease); it bakes that branch's registry and update channel, chosen by
# scripts/release-registry.sh in preflight (plan
# agentry-notes/plans/desktop-installers.md §6, D4; registers D-023, D-036).
# This workflow builds every platform artifact from that commit — Windows and
# Linux on the Linux runner, the universal macOS bundle and its dmg on the
# Mac — writes SHA256SUMS over them and over BUILD-INFO, signs those sums with
# the estate's own update-signing key, and uploads the set as ONE workflow
# artifact named for the version. Every tag also publishes a GitHub Release
# with that bundle (the publish job; agentry-desktop#192, DEV-148, reversing
# D-023's "no GitHub Release before 1.0"): a vX.Y.Z-dev.N tag's is a
# prerelease, a vX.Y.Z tag's a full release, and from 1.0.0 on a minor or
# major (X.Y.0) is left a draft for the operator to approve its notes (before
# 1.0.0 nothing is held, agentry-desktop#294). The site's downloads
# builder imports the bundle from this run (build-downloads.sh --from-run,
# agentry-web#152); agentry-web#444 moves the import to the Release.
#
# The tag scheme (agentry-desktop#279): vX.Y.Z on main's first-parent line is
# a production release, vX.Y.Z-dev.N on dev's a dev prerelease of the version
# main releases next (scripts/release-tag.sh, the CLI's, copied unchanged),
# and either names wails.json's productVersion, which stays X.Y.Z because the
# Windows version resource and the macOS bundle version take numbers only.
# The self-update check keeps each channel to itself (internal/selfupdate
# IsNewer): a dev build is offered only newer dev prereleases, a production
# build only newer production releases.
#
# workflow_dispatch runs the same jobs as a DRY RUN on a commit that is on
# main's or dev's line (preflight refuses any other, as it refuses such a
# tag): the version is whatever git describe says of that ref, the tag check
# is skipped when the ref is not a tag, a stale pin warns instead of
# refusing, and BUILD-INFO carries event=workflow_dispatch so the site's
# importer can refuse it.
#
# The version is derived once, in preflight, and every later job takes it
# from there: the Mac is a persistent runner whose tree can be -dirty for
# reasons of its own, and two derivations that disagree would build a bundle
# the completeness check then rejects.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# One run per ref, never cancelled by a later one: a release in flight
# finishes or fails on its own account.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  # Refuses before a single artifact is built: a tag of the wrong form or on
  # the wrong line, a 1.x without the operator, a tag that does not name the
  # version wails.json carries into the bundle metadata, or a pin of the core
  # or the CLI below its newest release — the desktop reads files the CLI
  # writes, so a stale pin ships as a build that cannot read them (D-020,
  # desktop#60). The daily pins job reports; this one refuses.
  preflight:
    runs-on: [self-hosted, linux, x64]
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.registry.outputs.channel }}
      registry: ${{ steps.registry.outputs.registry }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      latest: ${{ steps.tag.outputs.latest }}
      draft: ${{ steps.tag.outputs.draft }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # git describe needs the tags; the checkout token stays out of
          # .git/config, nothing after this step fetches with it.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The runner shares one persistent host module cache with every
          # other runner; restoring the Actions cache over it left partial
          # modules that broke go mod verify in the core (agentry#225).
          cache: false
      # The blaktron modules are private. The rewrite that carries the token
      # goes into a job-scoped git config file, removed at the end, so nothing
      # persists in the runner's home between jobs.
      - name: Authenticate for the private blaktron modules (job-scoped)
        env:
          AGENTRY_BUILD_TOKEN: ${{ secrets.AGENTRY_BUILD_TOKEN }}
        run: |
          set -euo pipefail
          echo "GIT_CONFIG_GLOBAL=$RUNNER_TEMP/gitconfig" >> "$GITHUB_ENV"
          echo "GOPRIVATE=github.com/blaktron/*" >> "$GITHUB_ENV"
          git config --file "$RUNNER_TEMP/gitconfig" url."https://x-access-token:${AGENTRY_BUILD_TOKEN}@github.com/".insteadOf "https://github.com/"
      # A tag is vX.Y.Z on main's first-parent line or vX.Y.Z-dev.N on dev's
      # (agentry-desktop#279, DEV-148), releases only move forward, and a 1.x
      # waits for the operator's AGENTRY_ALLOW_V1 (agentry#522). The script is
      # the CLI's, copied unchanged (agentry-cli#327, DR-40; D-032's
      # copy-not-share convention), so the rule is the same in both clients.
      - name: The tag, its line and what it releases
        id: tag
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
          AGENTRY_ALLOW_V1: ${{ vars.AGENTRY_ALLOW_V1 }}
        run: |
          set -euo pipefail
          if ! out=$(scripts/release-tag.sh check "$TAG" "$GITHUB_SHA" 2>"$RUNNER_TEMP/tag-check.err"); then
            echo "::error::$(cat "$RUNNER_TEMP/tag-check.err")"; exit 1
          fi
          printf '%s\n' "$out"
          grep -E '^(prerelease|latest|draft)=' <<<"$out" >> "$GITHUB_OUTPUT"
      - name: The tag names wails.json's productVersion
        if: github.ref_type == 'tag'
        run: make version-check RELEASE_TAG="${GITHUB_REF_NAME}"
      # A tag's version is the tag itself, not git describe: describe names
      # one of several tags on the same commit (alphabetically), so a second
      # dev prerelease cut on an unchanged head would otherwise build, stamp
      # and sign itself as the first. A dry run is named by describe.
      - name: The version this release is named for
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = tag ]; then v=${TAG#v}; else v=$(make -s version); fi
          [ -n "$v" ] || { echo "::error::no version for this run"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "version $v"
      # Production's registry for a commit that has been main's head, dev's
      # for one that has been dev's, refused for any other commit, before a
      # binary is built (agentry-desktop#183: the CLI's scripts/release-registry.sh,
      # agentry-cli#240 and DR-33, copied unchanged). build/release.env names
      # both and is the same on both branches; the history picks. The
      # checkout's fetch-depth 0 brings the origin/main and origin/dev refs
      # the rule reads. Both build jobs and BUILD-INFO take it from here.
      - name: The channel and the registry this release bakes in
        id: registry
        run: |
          set -euo pipefail
          # The history picks the registry; a release.env line would outvote
          # it in a build step that sources the file (agentry-desktop#183).
          if grep -E '^[[:space:]]*(export[[:space:]]+)?AGENTRY_DEFAULT_REGISTRY=' build/release.env >/dev/null; then
            echo "::error::build/release.env sets AGENTRY_DEFAULT_REGISTRY; it names AGENTRY_REGISTRY_PRODUCTION and AGENTRY_REGISTRY_DEV, and scripts/release-registry.sh picks one"; exit 1
          fi
          out=$(scripts/release-registry.sh "${GITHUB_SHA}")
          printf '%s\n' "$out"
          sed -n -e 's/^AGENTRY_RELEASE_CHANNEL=/channel=/p' -e 's/^AGENTRY_DEFAULT_REGISTRY=/registry=/p' <<<"$out" >> "$GITHUB_OUTPUT"
          echo "::notice::${GITHUB_SHA} is a $(sed -n 's/^AGENTRY_RELEASE_CHANNEL=//p' <<<"$out") release"
      # go list -m -u compares against the newest release the core and the CLI
      # have tagged (vX.Y.Z; their -dev.N prereleases do not count once a
      # release exists), since both release from v0.6.0 (DEV-148). So a pin
      # below either's newest release refuses a tag until it is bumped, which
      # is D-020's rule with a version to point at (the daily pins job makes
      # the same comparison). A dry run warns; a tag refuses.
      - name: The pins of the core and the CLI are current
        run: |
          set -euo pipefail
          behind=$(go list -m -u -f '{{if .Update}}{{.Path}}: {{.Version}} -> {{.Update.Version}}{{end}}' \
            github.com/blaktron/agentry github.com/blaktron/agentry-cli)
          if [ -n "$behind" ]; then
            echo "$behind"
            msg="A pinned dependency is below its newest release; a release built from it could not read a file the current CLI writes (desktop#60). Bump with: go get github.com/blaktron/agentry@latest github.com/blaktron/agentry-cli@latest, merge, then tag."
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then echo "::warning::dry run on stale pins: $msg"; else echo "::error::$msg"; exit 1; fi
          else
            echo "pins are current"
          fi
      # A tag can land on a commit whose ci run never happened, and both
      # build jobs ship the checked-in bindings without regenerating them,
      # so the release checks for itself that those bindings are what the Go
      # types generate (desktop#97).
      - name: Install the wails CLI at the version go.mod pins
        run: go install "github.com/wailsapp/wails/v2/cmd/wails@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"
      - name: The checked-in bindings are current
        run: |
          set -euo pipefail
          make bindings
          drift=$(git status --porcelain -- frontend/wailsjs)
          if [ -n "$drift" ]; then echo "$drift"; echo "::error::the checked-in bindings differ from what the Go types generate: run make bindings, commit, then tag"; exit 1; fi
          echo "bindings are current"
      - name: Remove the job-scoped git credential
        if: always()
        run: rm -f "$RUNNER_TEMP/gitconfig"

  # Windows is cross-built by the wails CLI (DEV-097) and its per-user
  # installer by makensis from build/windows/installer/project.nsi
  # (desktop#83; the ci workflow's windows job does the same on every PR);
  # Linux is built inside a Debian container carrying the GTK and WebKit
  # headers the runner image does not (scripts/build-linux.sh), then wrapped
  # in a .deb and an .rpm by nfpm (desktop#84), from the
  # tree vendored here with the job's credential — the container itself gets
  # no credential: the checkout token is not persisted and the job-scoped
  # git config is not mounted. The Windows artifacts are Authenticode-signed
  # here (agentry-desktop#54); the Linux ones carry no OS signature.
  linux-windows:
    needs: preflight
    runs-on: [self-hosted, linux, x64]
    # The `release` environment is what the Windows signing credential is
    # scoped to (agentry-desktop#151, #54; plan os-code-signing.md D6): the
    # Entra federated credential matches a job of this repository in this
    # environment and nothing else, and the environment admits only main and
    # v* tags, so a dry run starts from main or a tag or does not start.
    # id-token lets the job mint the OIDC token it exchanges; contents: read
    # is what checkout needs and is repeated here because a job-level
    # permissions block replaces the workflow's.
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    outputs:
      signed_windows: ${{ steps.package.outputs.signed_windows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Shared persistent host module cache; see preflight (agentry#225).
          cache: false
      - name: Authenticate for the private blaktron modules (job-scoped)
        env:
          AGENTRY_BUILD_TOKEN: ${{ secrets.AGENTRY_BUILD_TOKEN }}
        run: |
          set -euo pipefail
          echo "GIT_CONFIG_GLOBAL=$RUNNER_TEMP/gitconfig" >> "$GITHUB_ENV"
          echo "GOPRIVATE=github.com/blaktron/*" >> "$GITHUB_ENV"
          git config --file "$RUNNER_TEMP/gitconfig" url."https://x-access-token:${AGENTRY_BUILD_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          # setup-node v5+ caches through GitHub's store on its own when
          # package.json names a package manager; the runners keep npm's cache
          # on the host instead (agentry-desktop#209).
          package-manager-cache: false
      - name: What this release bakes in
        env:
          # preflight's, from the commit's history (agentry-desktop#183):
          # required, so an empty output cannot bake the source default.
          AGENTRY_DEFAULT_REGISTRY: ${{ needs.preflight.outputs.registry }}
        run: |
          set -euo pipefail
          : "${AGENTRY_DEFAULT_REGISTRY:?preflight named no registry for this commit}"
          echo "AGENTRY_DEFAULT_REGISTRY=${AGENTRY_DEFAULT_REGISTRY}" >> "$GITHUB_ENV"
          # The update channel is the same site's downloads manifest: on
          # SecureAgentry the edge serves the registry and the downloads from
          # one host (plan §7, D5), so one line decides both and they cannot
          # drift apart. A build that baked a registry but no channel would
          # check nothing and say nothing, which is the quietest way for this
          # feature not to exist (agentry-desktop#87).
          echo "AGENTRY_UPDATE_CHANNEL=${AGENTRY_DEFAULT_REGISTRY%/}/downloads/manifest.json" >> "$GITHUB_ENV"
          echo "EXTRA_LDFLAGS=-w -s -X github.com/blaktron/agentry-desktop/internal/settings.DefaultRegistryURL=${AGENTRY_DEFAULT_REGISTRY} -X github.com/blaktron/agentry-desktop/internal/selfupdate.ManifestURL=${AGENTRY_DEFAULT_REGISTRY%/}/downloads/manifest.json" >> "$GITHUB_ENV"
          # The CN the Windows signature must carry, when release.env names
          # one (agentry-desktop#54): the installer check refuses any other.
          # Read in a subshell, so nothing else in the file reaches the build.
          cn=$(set -a; . build/release.env; printf '%s' "${AGENTRY_WINDOWS_SIGNING_CN:-}")
          [ -z "$cn" ] || echo "AGENTRY_WINDOWS_SIGNING_CN=${cn}" >> "$GITHUB_ENV"
      - name: Build the embedded frontend bundle
        run: cd frontend && npm ci --no-audit --no-fund && npx tsc --noEmit && npx vite build
      - name: Install the wails CLI at the version go.mod pins
        run: go install "github.com/wailsapp/wails/v2/cmd/wails@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"
      # The installer's toolchain, from Ubuntu's packages: the runner
      # container runs as root and keeps them until it is recreated (see the
      # ci workflow's windows job).
      - name: makensis, 7z, java, osslsigncode, jq and openssl from Ubuntu's packages
        run: |
          set -euo pipefail
          if ! command -v makensis >/dev/null || ! command -v 7z >/dev/null || ! command -v java >/dev/null || ! command -v osslsigncode >/dev/null || ! command -v jq >/dev/null || ! command -v openssl >/dev/null; then
            sudo=""; [ "$(id -u)" = 0 ] || sudo=sudo
            $sudo apt-get update -qq
            $sudo apt-get install -y -qq --no-install-recommends nsis p7zip-full default-jre-headless osslsigncode jq openssl
          fi
          makensis -VERSION; 7z | sed -n 2p; java -version 2>&1 | sed -n 1p; osslsigncode --version 2>&1 | sed -n 1p
      # jsign, the signer, at the version and digest scripts/sign-windows.sh
      # pins; a jar with another digest is refused before it runs.
      - name: jsign at the pinned digest
        run: scripts/sign-windows.sh fetch "$RUNNER_TEMP"
      # Authenticode (agentry-desktop#54; plan os-code-signing.md §4), in
      # three make targets so the signing token reaches the signer and
      # nothing else. build-windows: wails builds the exe (and, as a side
      # effect of -nsis, an unsigned installer, the WebView2 bootstrapper and
      # wails_tools.nsh). -m: no go mod tidy (the module graph is already
      # resolved); -s: the frontend bundle was just built; -skipbindings: the
      # checked-in TypeScript bindings stay as they are; VERSION overrides
      # the Makefile's own describe so every job names one version.
      - name: Windows amd64 exe (wails)
        run: PATH="$HOME/go/bin:$PATH" make build-windows VERSION="$VERSION" WAILS_FLAGS='-m -s -skipbindings' EXTRA_LDFLAGS="$EXTRA_LDFLAGS"
      # sign-windows: the job proves who it is with the OIDC token GitHub
      # minted for it and gets an Azure access token for the signing service
      # in return (scripts/signing-token.sh, the exchange the
      # signing-oidc-probe workflow proves on its own: no Azure secret, both
      # tokens via curl's stdin config, never argv). The access token is
      # masked, lives in this step's shell, and reaches jsign through the
      # environment of this one make target (`--storepass env:`), so it is
      # in no process listing and touches no build tool. The target signs
      # the exe before makensis embeds it, and makensis signs the installer
      # and the uninstaller through project.nsi's hooks. There is no
      # unsigned fallback: a missing variable, a refused exchange, a jsign
      # failure or a signer that exits non-zero fails the release.
      - name: Sign the exe, then the installer and its uninstaller (Artifact Signing over OIDC)
        env:
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
        run: |
          set -euo pipefail
          for v in AZURE_TENANT_ID AZURE_CLIENT_ID ARTIFACT_SIGNING_ENDPOINT ARTIFACT_SIGNING_ACCOUNT ARTIFACT_SIGNING_PROFILE; do
            [ -n "${!v:-}" ] || { echo "::error::the $v repository variable is not set: run scripts/operator/artifact-signing-setup.sh (agentry-desktop#151)"; exit 1; }
          done
          token=$(scripts/signing-token.sh) || { echo "::error::no signing token: the release environment's federated credential (agentry-desktop#151) must match this job's OIDC subject"; exit 1; }
          [ -n "$token" ] || { echo "::error::signing-token.sh printed no token"; exit 1; }
          echo "::add-mask::$token"
          echo "signing as $ARTIFACT_SIGNING_ACCOUNT/$ARTIFACT_SIGNING_PROFILE at $ARTIFACT_SIGNING_ENDPOINT"
          AGENTRY_SIGNING_TOKEN="$token" JSIGN_JAR="$RUNNER_TEMP/jsign.jar" \
            make sign-windows VERSION="$VERSION" SIGN_CMD=scripts/sign-windows.sh
      # finish-windows: the zip and the setup name, then
      # scripts/check-windows-installer.sh --signed verifies all three
      # signatures to the pinned Microsoft root, insists on the timestamp,
      # and writes the report this job hands the bundle for BUILD-INFO.
      - name: "Windows package: zip, setup name, and the signed read-back"
        id: package
        env:
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
        run: |
          set -euo pipefail
          make finish-windows VERSION="$VERSION" SIGN_CMD=scripts/sign-windows.sh
          [ -f build/bin/windows-signing.txt ] || { echo "::error::the installer check wrote no signing report"; exit 1; }
          cn=$(sed -n 's/^cn=//p' build/bin/windows-signing.txt); ts=$(sed -n 's/^timestamp=//p' build/bin/windows-signing.txt); root=$(sed -n 's/^root=//p' build/bin/windows-signing.txt)
          [ -n "$cn" ] && [ -n "$ts" ] && [ -n "$root" ] || { cat build/bin/windows-signing.txt; echo "::error::the signing report is incomplete"; exit 1; }
          # The grammar the site's importer reads (agentry-web#187): the
          # tokens, in this order, each `key=value` with the value running to
          # the next known key; CN, timestamp and root carry spaces.
          echo "signed_windows=authenticode CN=$cn profile=$ARTIFACT_SIGNING_ACCOUNT/$ARTIFACT_SIGNING_PROFILE timestamp=$ts verified=osslsigncode root=$root" >> "$GITHUB_OUTPUT"
          cat build/bin/windows-signing.txt
      # The binary, then the .deb and .rpm from build/nfpm/nfpm.yaml
      # (desktop#84): the bare binary stays as its own artifact.
      - name: Linux amd64 binary and packages, in the container that carries the GTK headers
        run: |
          set -euo pipefail
          GOWORK=off go mod vendor
          make package-linux VERSION="$VERSION" EXTRA_LDFLAGS="$EXTRA_LDFLAGS"
      # Each package installed in a clean container of its family: the
      # declared dependencies are exactly what the binary links, the app
      # starts under Xvfb, and a populated home survives reinstall and
      # removal. A red here is a package that would not install or would
      # reach where it must not; it is not skipped for a release.
      - name: Install smoke of the .deb (Debian) and the .rpm (Fedora)
        run: make smoke-linux-packages VERSION="$VERSION"
      - name: Stage the artifacts, and check the bake reached them
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "build/bin/agentry-desktop-$VERSION-windows-amd64.exe" "build/bin/agentry-desktop-$VERSION-windows-amd64.zip" "build/bin/agentry-desktop-$VERSION-windows-amd64-setup.exe" "build/linux/agentry-desktop-$VERSION-linux-amd64" "build/linux/agentry-desktop-$VERSION-linux-amd64.deb" "build/linux/agentry-desktop-$VERSION-linux-amd64.rpm" dist/
          # -X on a symbol that moved fails silently; the URL must be in the binaries.
          for f in dist/agentry-desktop-"$VERSION"-linux-amd64 dist/agentry-desktop-"$VERSION"-windows-amd64.exe; do
            grep -q -a -F "$AGENTRY_DEFAULT_REGISTRY" "$f" || { echo "::error::$f does not carry $AGENTRY_DEFAULT_REGISTRY"; exit 1; }
            grep -q -a -F "$AGENTRY_UPDATE_CHANNEL" "$f" || { echo "::error::$f does not carry the update channel $AGENTRY_UPDATE_CHANNEL, so it would never look for a newer release"; exit 1; }
          done
          # The installer carries the same exe (make package-windows checked
          # the bytes) and the deb and rpm carry the same Linux binary (the
          # smoke compared them); the bake reaches them through those
          # binaries, compressed, so the checks above are the ones that prove it.
          ls -la dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-windows
          path: dist/*
          if-no-files-found: error
          # A hand-off to the bundle job minutes later, across hosts (the
          # Linux runners and the Mac share no disk), so GitHub's store is
          # the one place both reach; a day covers re-running bundle
          # (agentry-desktop#188).
          retention-days: 1
      - name: Remove the job-scoped git credential
        if: always()
        run: rm -f "$RUNNER_TEMP/gitconfig"

  # The one target that cannot be cross-built (D-021, agentry-desktop#57):
  # the universal bundle is built on the estate's Mac, the same way the ci
  # workflow's macos job does, with the release's version and linker flags,
  # and wrapped in both the zip and the dmg the download page offers
  # (agentry-desktop#85). A production release (a vX.Y.Z tag on main's
  # line, or a dry run there) Developer ID-signs, notarizes and staples the bundle and then the dmg
  # (agentry-desktop#6; plan os-code-signing.md §5, D4, D5, D8) with the
  # five APPLE_* repository secrets, which reach only the two steps that
  # sign; a missing one fails the release, there is no unsigned fallback.
  # A dev prerelease (-dev.N) ships ad-hoc signed and does not wait on
  # Apple's notary queue, as the CLI's dev prereleases do (agentry-cli#570):
  # each notarization took 40 to 75 minutes for this team in October 2026,
  # and this job makes two in a row (the dmg holds the stapled bundle).
  macos:
    needs: preflight
    runs-on: [self-hosted, macOS, ARM64]
    # The environment the signing credentials belong in (plan
    # os-code-signing.md D6): it admits only main and v* tags, as for
    # linux-windows. The five APPLE_* values are still repository secrets,
    # which any workflow in this repository could read; moving them into
    # this environment is the operator's (agentry-desktop#563).
    environment: release
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    outputs:
      signed_darwin: ${{ steps.readback.outputs.signed_darwin }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          # setup-node v5+ caches through GitHub's store on its own when
          # package.json names a package manager; the runners keep npm's cache
          # on the host instead (agentry-desktop#209).
          package-manager-cache: false
      # A persistent, non-container runner: caches live in stable places under
      # the runner user's home rather than accumulating per job, and nothing
      # here is restored over them. The wails CLI goes on PATH from ~/go/bin.
      - name: Pin the caches and PATH
        run: |
          mkdir -p "$HOME/runner-cache/go-mod" "$HOME/runner-cache/go-build" "$HOME/runner-cache/npm"
          {
            echo "GOMODCACHE=$HOME/runner-cache/go-mod"
            echo "GOCACHE=$HOME/runner-cache/go-build"
            echo "npm_config_cache=$HOME/runner-cache/npm"
            echo "GOPRIVATE=github.com/blaktron/*"
            echo "GIT_CONFIG_GLOBAL=$RUNNER_TEMP/gitconfig"
            # The two signing steps append to it, the read-back reads it,
            # the last step removes it.
            echo "DARWIN_SIGNING_REPORT=$RUNNER_TEMP/darwin-signing.txt"
          } >> "$GITHUB_ENV"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      # Job-scoped on this persistent host (see ci.yaml): removed at the end.
      - name: Authenticate for the private blaktron modules (job-scoped)
        env:
          AGENTRY_BUILD_TOKEN: ${{ secrets.AGENTRY_BUILD_TOKEN }}
        run: |
          git config --file "$GIT_CONFIG_GLOBAL" url."https://x-access-token:${AGENTRY_BUILD_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: What this release bakes in
        env:
          # preflight's, from the commit's history (agentry-desktop#183):
          # required, so an empty output cannot bake the source default.
          AGENTRY_DEFAULT_REGISTRY: ${{ needs.preflight.outputs.registry }}
        run: |
          set -euo pipefail
          : "${AGENTRY_DEFAULT_REGISTRY:?preflight named no registry for this commit}"
          echo "AGENTRY_DEFAULT_REGISTRY=${AGENTRY_DEFAULT_REGISTRY}" >> "$GITHUB_ENV"
          # The update channel is the same site's downloads manifest: on
          # SecureAgentry the edge serves the registry and the downloads from
          # one host (plan §7, D5), so one line decides both and they cannot
          # drift apart. A build that baked a registry but no channel would
          # check nothing and say nothing, which is the quietest way for this
          # feature not to exist (agentry-desktop#87).
          echo "AGENTRY_UPDATE_CHANNEL=${AGENTRY_DEFAULT_REGISTRY%/}/downloads/manifest.json" >> "$GITHUB_ENV"
          echo "EXTRA_LDFLAGS=-w -s -X github.com/blaktron/agentry-desktop/internal/settings.DefaultRegistryURL=${AGENTRY_DEFAULT_REGISTRY} -X github.com/blaktron/agentry-desktop/internal/selfupdate.ManifestURL=${AGENTRY_DEFAULT_REGISTRY%/}/downloads/manifest.json" >> "$GITHUB_ENV"
      - name: Install the wails CLI at the version go.mod pins
        run: go install "github.com/wailsapp/wails/v2/cmd/wails@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"
      # Production signs, dev does not (the job's comment above). The
      # identity and the Team ID are public and committed (build/release.env,
      # agentry-desktop#518); the secrets are only counted here.
      - name: Whether this release signs and notarizes for macOS
        id: apple
        env:
          CHANNEL: ${{ needs.preflight.outputs.channel }}
          HAS_APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 != '' }}
          HAS_APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD != '' }}
          HAS_APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 != '' }}
          HAS_APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID != '' }}
          HAS_APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID != '' }}
        run: |
          set -euo pipefail
          case "$CHANNEL" in
            dev)
              echo "sign=false" >> "$GITHUB_OUTPUT"
              echo "::notice::A dev prerelease: the macOS bundle and dmg ship ad-hoc signed and are not notarized (an empty signed_darwin= in BUILD-INFO); only a production release signs them (agentry-desktop#6, as agentry-cli#570)." ;;
            production)
              missing=""
              for v in APPLE_DEVELOPER_ID_P12 APPLE_DEVELOPER_ID_P12_PASSWORD APPLE_NOTARY_KEY_P8 APPLE_NOTARY_KEY_ID APPLE_NOTARY_ISSUER_ID; do
                eval "has=\${HAS_$v}"
                [ "$has" = true ] || missing="$missing $v"
              done
              [ -z "$missing" ] || { echo "::error::A production release Developer ID-signs and notarizes the macOS bundle and dmg (agentry-desktop#6), and these repository secrets are not set:$missing. The operator's Apple signing wizard loads them (agentry-desktop#152)."; exit 1; }
              id=$(set -a; . build/release.env; printf '%s' "${APPLE_SIGNING_IDENTITY:-}")
              team=$(set -a; . build/release.env; printf '%s' "${APPLE_TEAM_ID:-}")
              [ -n "$id" ] && [ -n "$team" ] || { echo "::error::build/release.env must name APPLE_SIGNING_IDENTITY and APPLE_TEAM_ID"; exit 1; }
              case "$id" in *"($team)") ;; *) echo "::error::APPLE_SIGNING_IDENTITY ($id) is not of APPLE_TEAM_ID $team"; exit 1 ;; esac
              { echo "APPLE_SIGNING_IDENTITY=$id"; echo "APPLE_TEAM_ID=$team"; } >> "$GITHUB_ENV"
              echo "sign=true" >> "$GITHUB_OUTPUT"
              echo "macOS: Developer ID ($id), notarized and stapled, on this runner" ;;
            *) echo "::error::preflight named channel '$CHANNEL'"; exit 1 ;;
          esac
      # -skipbindings: the checked-in bindings, checked current in
      # preflight, are what ships; a release never regenerates them
      # (desktop#97). -m: skip wails' own go mod tidy. build-darwin builds
      # the bundle only; wrap-darwin below makes the zip and the dmg from it,
      # after the bundle is signed where this release signs.
      - name: Build the universal bundle
        run: |
          set -euo pipefail
          make build-darwin VERSION="$VERSION" WAILS_FLAGS='-m -skipbindings' EXTRA_LDFLAGS="$EXTRA_LDFLAGS"
          lipo -info build/bin/agentry-desktop.app/Contents/MacOS/agentry-desktop
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/bin/agentry-desktop.app/Contents/Info.plist
          grep -q -a -F "$AGENTRY_DEFAULT_REGISTRY" build/bin/agentry-desktop.app/Contents/MacOS/agentry-desktop || { echo "::error::the bundle does not carry $AGENTRY_DEFAULT_REGISTRY"; exit 1; }
          grep -q -a -F "$AGENTRY_UPDATE_CHANNEL" build/bin/agentry-desktop.app/Contents/MacOS/agentry-desktop || { echo "::error::the bundle does not carry the update channel $AGENTRY_UPDATE_CHANNEL, so it would never look for a newer release"; exit 1; }
      # Signed inside-out under the hardened runtime with Apple's timestamp
      # and no entitlements, notarized, stapled, and read back: the identity
      # and team release.env names, the designated requirement naming the
      # team, the ticket, and spctl's "Notarized Developer ID"
      # (scripts/sign-darwin.sh). The certificate is imported into a keychain
      # the script makes in this job's temp directory and deletes on exit,
      # failing if it is still on the search list; the job's last steps
      # catch a run killed before it could (D5). The wait is Apple's.
      - name: Developer ID-sign, notarize and staple the bundle
        if: steps.apple.outputs.sign == 'true'
        env:
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          rm -f "$DARWIN_SIGNING_REPORT"
          SIGN_DARWIN_REPORT="$DARWIN_SIGNING_REPORT" scripts/sign-darwin.sh app build/bin/agentry-desktop.app
      # The zip and the dmg from the bundle as it now is (stapled, where this
      # release signs), and the dmg read back (scripts/check-darwin-dmg.sh:
      # it mounts, holds the bundle and an Applications shortcut, is
      # universal, its signature verifies, and it is the same bundle the zip
      # carries).
      - name: Wrap the bundle in its zip and its dmg
        run: make wrap-darwin VERSION="$VERSION"
      - name: Developer ID-sign, notarize and staple the dmg
        if: steps.apple.outputs.sign == 'true'
        env:
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          SIGN_DARWIN_REPORT="$DARWIN_SIGNING_REPORT" scripts/sign-darwin.sh dmg "build/bin/agentry-desktop-$VERSION-darwin-universal.dmg"
      # The two files that ship, read back with no secret in reach: the dmg
      # and the bundle on it (check-darwin-dmg.sh --signed), and the bundle
      # the zip unpacks to — each Developer ID-signed by the team, stapled,
      # and accepted by Gatekeeper as Notarized Developer ID. Only then does
      # BUILD-INFO get to say so.
      - name: The shipped zip and dmg, read back as signed and notarized
        id: readback
        if: steps.apple.outputs.sign == 'true'
        run: |
          set -euo pipefail
          scripts/check-darwin-dmg.sh --signed "build/bin/agentry-desktop-$VERSION-darwin-universal.dmg" build/bin/agentry-desktop.app
          scripts/sign-darwin.sh assess "build/bin/agentry-desktop-$VERSION-darwin-universal.zip"
          r=$DARWIN_SIGNING_REPORT
          team=$(sed -n 's/^team=//p' "$r" | sort -u)
          [ "$team" = "$APPLE_TEAM_ID" ] && grep -qx 'notarized=true' "$r" && grep -q '^submission_app=' "$r" && grep -q '^submission_dmg=' "$r" \
            || { cat "$r"; echo "::error::the signing report is incomplete"; exit 1; }
          sed -n 's/^submission_/Apple notary submission, /p' "$r"
          echo "signed_darwin=developer-id TEAM=$team notarized=true" >> "$GITHUB_OUTPUT"
      # Uploaded before the smoke, not after: a smoke that goes red fails the
      # release, and that is exactly when someone wants the image to look at.
      # The bundle job needs this one to have succeeded, so nothing a failed
      # run uploaded can reach a release.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-darwin
          path: |
            build/bin/agentry-desktop-${{ needs.preflight.outputs.version }}-darwin-universal.zip
            build/bin/agentry-desktop-${{ needs.preflight.outputs.version }}-darwin-universal.dmg
          if-no-files-found: error
          # A hand-off to the bundle job minutes later, across hosts (the
          # Linux runners and the Mac share no disk), so GitHub's store is
          # the one place both reach; a day covers re-running bundle
          # (agentry-desktop#188).
          retention-days: 1
      # Dragging the bundle onto Applications over a copy already there leaves
      # the settings, the installed agents, the pinned key, the runner policy
      # and a keychain item byte-identical (plan §8), and the bundle installed
      # from the image launches where a console session allows it. The keychain
      # half uses a keychain the script creates inside its own temporary
      # directory and names explicitly, so it runs on this runner too, which
      # has no login keychain at all (#106). This step gates a release: a red
      # here is a release that does not complete.
      - name: Install-over-install smoke of the dmg
        run: make smoke-darwin-dmg VERSION="$VERSION"
      # Applying a newer Agentry Desktop: the bundle swap, that the person's
      # configuration is byte-identical afterwards, and that a copy they
      # cannot replace is refused rather than elevated (agentry-desktop#88).
      # The relaunch is not proven here — it needs a console session, which
      # this runner has not got (#106) — and the script says so.
      - name: Self-update bundle-swap acceptance
        run: make smoke-darwin-selfupdate VERSION="$VERSION"
      # The custody check of plan os-code-signing.md M-M2 step 7, at the job
      # level: sign-darwin.sh deletes its keychain and its directory on exit,
      # and this catches the paths where it never got to (a cancelled or
      # timed-out job whose process was killed). Any signing keychain still
      # on the build user's search list, or any of its directories still in
      # this job's temp, is removed and fails the job (D5: never a persistent
      # keychain on the runner).
      - name: No signing keychain or key is left on the runner
        if: always()
        run: |
          set -uo pipefail
          left=$(security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"[[:space:]]*$//' | grep '/sign-darwin\.' || true)
          dirs=$(find "$RUNNER_TEMP" -maxdepth 1 -name 'sign-darwin.*' -print 2>/dev/null || true)
          [ -z "$left$dirs" ] && { echo "no signing keychain on the search list, no signing directory in $RUNNER_TEMP"; exit 0; }
          while IFS= read -r kc; do [ -n "$kc" ] && { security delete-keychain "$kc" 2>/dev/null || true; }; done <<<"$left"
          while IFS= read -r d; do [ -n "$d" ] && rm -rf "$d"; done <<<"$dirs"
          echo "::error::a signing keychain or its directory outlived sign-darwin.sh (removed now): ${left:+keychains: $left }${dirs:+directories: $dirs}"
          exit 1
      - name: Remove the job-scoped git credential and the signing report
        if: always()
        run: rm -f "$GIT_CONFIG_GLOBAL" "$DARWIN_SIGNING_REPORT"

  # One bundle: every platform artifact, BUILD-INFO saying what built it and
  # what it bakes in, SHA256SUMS covering all of them — every file but
  # SHA256SUMS itself is in the sums, and every artifact the release matrix
  # names is present — and SHA256SUMS.minisig, the estate's own signature over
  # those sums (agentry-desktop#86; plan §7, D5; register D-026). This
  # artifact is the release's hand-off to the site: agentry-web's
  # build-downloads.sh --from-run imports it with `gh run download` from the
  # tag's run (D-023), so it stays in GitHub's store. A tag's bundle is kept
  # 90 days (the site's downloads directory is the long-lived copy, plan
  # §6); a workflow_dispatch dry run's, which the site refuses anyway, 7
  # (agentry-desktop#188).
  bundle:
    needs: [preflight, linux-windows, macos]
    runs-on: [self-hosted, linux, x64]
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Shared persistent host module cache; see preflight (agentry#225).
          cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: bundle
      - name: BUILD-INFO
        env:
          SIGNED_WINDOWS: ${{ needs.linux-windows.outputs.signed_windows }}
          SIGNED_DARWIN: ${{ needs.macos.outputs.signed_darwin }}
          AGENTRY_DEFAULT_REGISTRY: ${{ needs.preflight.outputs.registry }}
          AGENTRY_RELEASE_CHANNEL: ${{ needs.preflight.outputs.channel }}
        run: |
          set -euo pipefail
          : "${AGENTRY_DEFAULT_REGISTRY:?preflight named no registry}" "${AGENTRY_RELEASE_CHANNEL:?preflight named no channel}"
          {
            echo "product=agentry-desktop"
            echo "version=$VERSION"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "ref=${GITHUB_REF}"
            echo "commit=${GITHUB_SHA}"
            echo "default_registry=${AGENTRY_DEFAULT_REGISTRY}"
            echo "channel=${AGENTRY_RELEASE_CHANNEL}"
            # signed= is true only when EVERY artifact is OS-signed; the
            # per-platform lines say which are. Windows since #54, macOS on
            # production releases since #6; the Linux packages carry no OS
            # signature, so this stays false.
            echo "signed=false"
            : "${SIGNED_WINDOWS:?the linux-windows job reported no Windows signature, and a release without one does not complete}"
            echo "signed_windows=${SIGNED_WINDOWS}"
            # The site's importer reads this line (agentry-web#188, the
            # grammar it already reads from the CLI's, agentry-web#215):
            # "developer-id TEAM=<id> notarized=true", or empty on a dev
            # prerelease. Production without it does not complete.
            if [ "$AGENTRY_RELEASE_CHANNEL" = production ] && [ -z "$SIGNED_DARWIN" ]; then
              echo "::error::a production release whose macos job reported no Developer ID signature does not complete" >&2; exit 1
            fi
            echo "signed_darwin=${SIGNED_DARWIN}"
            echo "built_by=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > bundle/BUILD-INFO
          cat bundle/BUILD-INFO
      - name: SHA256SUMS over every file, and every platform present
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd bundle
          files=(*)
          [ "${#files[@]}" -gt 0 ] || { echo "::error::the bundle is empty"; exit 1; }
          for f in "${files[@]}"; do
            case "$f" in BUILD-INFO|agentry-desktop-"$VERSION"-*) ;; *) echo "::error::$f is not an artifact of $VERSION"; exit 1;; esac
          done
          sha256sum "${files[@]}" > SHA256SUMS
          sha256sum -c SHA256SUMS
          for f in *; do [ "$f" = SHA256SUMS ] || grep -q " $f\$" SHA256SUMS || { echo "::error::$f is not covered by SHA256SUMS"; exit 1; }; done
          # The release matrix, as the site's download page lists it.
          for want in linux-amd64 linux-amd64.deb linux-amd64.rpm windows-amd64.exe windows-amd64.zip windows-amd64-setup.exe darwin-universal.zip darwin-universal.dmg; do
            [ -f "agentry-desktop-$VERSION-$want" ] || { echo "::error::agentry-desktop-$VERSION-$want is missing"; exit 1; }
          done
          cat SHA256SUMS
      # The estate's own signature over those sums — the trust root the app's
      # self-update checks before it touches a byte (plan §3, §7, D5). It is
      # OUR key, not the operating system's: independent of Developer ID (#6)
      # and Authenticode (#54), which secure a different thing.
      #
      # internal/cmd/signrelease signs and then verifies what it wrote against
      # the COMMITTED key set, with the same code the application uses, so a
      # release cannot be published whose signature a shipped app would refuse
      # — the mistake rotation invites, a new secret without the matching
      # public half committed.
      #
      # Where the key goes, precisely, because the loose version of this
      # sentence is the kind that ages into a lie. The secret is an env var on
      # THIS STEP, as an Actions secret must be to reach a step at all. From
      # there it is piped on standard input to signrelease and never written to
      # disk, so nothing on the runner host holds it and no later step could
      # read a file it left; `env -u` drops it from the signing process's own
      # environment, so the compiled child and anything it might run cannot
      # read it either. It reaches no flag, so it is not in a process listing.
      # After this step ends, the variable is gone with the step's shell.
      #
      # SHA256SUMS.minisig is deliberately NOT inside SHA256SUMS: a signature
      # cannot cover itself. The completeness loop above ran before this step,
      # which is why it does not have to know about it.
      - name: Sign SHA256SUMS with the estate's update-signing key
        env:
          AGENTRY_UPDATE_SIGNING_KEY: ${{ secrets.AGENTRY_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${AGENTRY_UPDATE_SIGNING_KEY}" ]; then
            msg="No AGENTRY_UPDATE_SIGNING_KEY secret, so this release could not be signed and no app would install it. Run scripts/operator/update-signing-key.sh to create the key, load the secret and commit the public half (agentry-desktop#86, #110)."
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              echo "::warning::dry run without a signing key: $msg"
              exit 0
            fi
            echo "::error::$msg"; exit 1
          fi
          # Built first, so that `go run`'s own compile output cannot interleave
          # with the key on the pipe, and so the pipeline below is one process
          # reading one thing.
          go build -o "$RUNNER_TEMP/signrelease" ./internal/cmd/signrelease
          printf '%s' "${AGENTRY_UPDATE_SIGNING_KEY}" \
            | env -u AGENTRY_UPDATE_SIGNING_KEY "$RUNNER_TEMP/signrelease" \
                -key - \
                -in bundle/SHA256SUMS \
                -version "$VERSION" \
                -commit "${GITHUB_SHA}"
          ls -la bundle/SHA256SUMS.minisig
          cat bundle/SHA256SUMS.minisig
      - name: Remove the signing binary
        if: always()
        run: rm -f "$RUNNER_TEMP/signrelease"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agentry-desktop-${{ needs.preflight.outputs.version }}
          path: bundle/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 90 || 7 }}

  # The GitHub Release (agentry-desktop#192, DEV-148): every tag, never a dry
  # run. The bundle exactly as built, summed and signed; notes generated from
  # the commits under a header that says what is signed and how to check it.
  # From 1.0.0 on, a minor or major release (X.Y.0) is a draft until the
  # operator approves its notes and publishes it; before 1.0.0 nothing is held.
  publish:
    needs: [preflight, bundle]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      # Into this job's own temporary directory: the self-hosted runner keeps
      # its workspace between jobs, and a bundle/ left by an earlier release
      # there would ride along into files: below.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agentry-desktop-${{ needs.preflight.outputs.version }}
          path: ${{ runner.temp }}/bundle
      - name: The notes' header
        env:
          CHANNEL: ${{ needs.preflight.outputs.channel }}
          REGISTRY: ${{ needs.preflight.outputs.registry }}
          DRAFT: ${{ needs.preflight.outputs.draft }}
          PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
        run: |
          set -euo pipefail
          b="$RUNNER_TEMP/bundle"
          info() { sed -n "s/^$1=//p" "$b/BUILD-INFO"; }
          [ "$(info version)" = "$VERSION" ] || { echo "::error::BUILD-INFO names $(info version), not $VERSION"; exit 1; }
          [ "$(info default_registry)" = "$REGISTRY" ] || { echo "::error::BUILD-INFO bakes $(info default_registry), not $REGISTRY"; exit 1; }
          # A dev build is a prerelease and a production build is not: the
          # tag's form and the commit's line agreed in preflight, and this is
          # the same fact read from what was built.
          case "$(info channel)/$PRERELEASE" in production/false|dev/true) ;; *) echo "::error::BUILD-INFO channel=$(info channel) with prerelease=$PRERELEASE"; exit 1 ;; esac
          (cd "$b" && sha256sum -c SHA256SUMS)
          # Exactly what the sums cover, plus the sums and their signature.
          listed=$(awk '{print $2}' "$b/SHA256SUMS")
          extra=$(cd "$b" && for f in *; do case "$f" in SHA256SUMS|SHA256SUMS.minisig) ;; *) grep -Fx -- "$f" <<<"$listed" >/dev/null || echo "$f" ;; esac; done)
          [ -z "$extra" ] || { echo "::error::files the sums do not cover: $extra"; exit 1; }
          [ -f "$b/SHA256SUMS.minisig" ] || { echo "::error::a tagged release carries SHA256SUMS.minisig; this bundle has none"; exit 1; }
          win=$(info signed_windows)
          case "$win" in
            "authenticode "*) winl="the \`.exe\` and the installer are Authenticode-signed (${win%% profile=*}); the \`.zip\` carries the signed \`.exe\`" ;;
            "") winl="unsigned" ;;
            *) echo "::error::BUILD-INFO signed_windows='$win' is neither empty nor authenticode"; exit 1 ;;
          esac
          mac=$(info signed_darwin)
          case "$mac" in
            "developer-id TEAM="*" notarized=true")
              team=${mac#developer-id TEAM=}; team=${team%% *}
              macl="Developer ID-signed (team $team), notarised by Apple and stapled: the \`.dmg\`, and the application inside it and inside the \`.zip\`" ;;
            "") macl="not signed or notarised (a dev prerelease; production releases are, agentry-desktop#6). macOS will not open a downloaded copy until it is allowed in System Settings → Privacy & Security" ;;
            *) echo "::error::BUILD-INFO signed_darwin='$mac' is neither empty nor developer-id"; exit 1 ;;
          esac
          case "$CHANNEL" in
            production) what="A production release: it talks to $REGISTRY by default and checks $REGISTRY/downloads/manifest.json for newer production releases." ;;
            *) what="A dev prerelease, for testing on dev: it talks to $REGISTRY by default and checks $REGISTRY/downloads/manifest.json for newer dev prereleases only." ;;
          esac
          {
            echo "$what"
            echo
            echo "**Signatures** (DEV-148: signed where signing exists, unsigned where it does not):"
            echo "- \`SHA256SUMS\`: signed with the estate's update-signing key (\`SHA256SUMS.minisig\`, the key set in \`internal/selfupdate/keys.json\`); the app verifies it before it installs an update."
            echo "- Windows: $winl."
            echo "- macOS (\`.dmg\`, \`.zip\`): $macl."
            echo "- Linux (\`.deb\`, \`.rpm\`, the binary): no OS signature; the sums cover them."
            echo
            echo "Check a download against the sums: \`sha256sum -c --ignore-missing SHA256SUMS\`. \`BUILD-INFO\` (covered by the sums) records the commit, the channel and the registry."
            [ "$DRAFT" = true ] && { echo; echo "_A minor release: drafted for the operator to approve these notes and publish._"; }
            echo
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - name: The GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          name: Agentry Desktop ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/notes.md
          generate_release_notes: true
          files: ${{ runner.temp }}/bundle/*
          fail_on_unmatched_files: true
          prerelease: ${{ needs.preflight.outputs.prerelease }}
          draft: ${{ needs.preflight.outputs.draft }}
          make_latest: ${{ needs.preflight.outputs.latest }}
