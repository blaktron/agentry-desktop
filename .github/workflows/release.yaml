# A release of the desktop client is a pushed tag v<productVersion> on main
# (plan agentry-notes/plans/desktop-installers.md §6, D4; register D-023).
# This workflow builds every platform artifact from that commit — Windows and
# Linux on the Linux runner, the universal macOS bundle and its dmg on the
# Mac — writes SHA256SUMS over them and over BUILD-INFO, signs those sums with
# the estate's own update-signing key, and uploads the set as ONE workflow
# artifact named for the version. No GitHub Release is created
# before 1.0 (operator, 2026-09-19): the site's downloads builder imports the
# bundle from this run (build-downloads.sh --from-run, agentry-web#152) and
# the website is where a release lives.
#
# workflow_dispatch runs the same jobs on any ref as a DRY RUN: the version is
# whatever git describe says of that ref, the tag check is skipped when the
# ref is not a tag, a stale pin warns instead of refusing, and BUILD-INFO
# carries event=workflow_dispatch so the site's importer can refuse it.
#
# The version is derived once, in preflight, and every later job takes it
# from there: the Mac is a persistent runner whose tree can be -dirty for
# reasons of its own, and two derivations that disagree would build a bundle
# the completeness check then rejects.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# One run per ref, never cancelled by a later one: a release in flight
# finishes or fails on its own account.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  # Refuses before a single artifact is built: a tag that does not name the
  # version wails.json carries into the bundle metadata, or a pin of the core
  # or the CLI that is behind its default branch — the desktop reads files
  # the CLI writes, so a stale pin ships as a build that cannot read them
  # (D-020, desktop#60). The daily pins job reports; this one refuses.
  preflight:
    runs-on: [self-hosted, linux, x64]
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # git describe needs the tags; the checkout token stays out of
          # .git/config, nothing after this step fetches with it.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          # The runner shares one persistent host module cache with every
          # other runner; restoring the Actions cache over it left partial
          # modules that broke go mod verify in the core (agentry#225).
          cache: false
      # The blaktron modules are private. The rewrite that carries the token
      # goes into a job-scoped git config file, removed at the end, so nothing
      # persists in the runner's home between jobs.
      - name: Authenticate for the private blaktron modules (job-scoped)
        env:
          AGENTRY_BUILD_TOKEN: ${{ secrets.AGENTRY_BUILD_TOKEN }}
        run: |
          set -euo pipefail
          echo "GIT_CONFIG_GLOBAL=$RUNNER_TEMP/gitconfig" >> "$GITHUB_ENV"
          echo "GOPRIVATE=github.com/blaktron/*" >> "$GITHUB_ENV"
          git config --file "$RUNNER_TEMP/gitconfig" url."https://x-access-token:${AGENTRY_BUILD_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: The tag names wails.json's productVersion
        if: github.ref_type == 'tag'
        run: make version-check RELEASE_TAG="${GITHUB_REF_NAME}"
      - name: The version this release is named for
        id: version
        run: |
          set -euo pipefail
          v=$(make -s version)
          [ -n "$v" ] || { echo "::error::make version printed nothing"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "version $v"
      # go list -m -u compares against the newest version the module proxy
      # offers, which is the default branch head only while the core and the
      # CLI carry no semver tags (as today; the daily pins job makes the same
      # comparison). A dry run warns; a tag refuses.
      - name: The pins of the core and the CLI are current
        run: |
          set -euo pipefail
          behind=$(go list -m -u -f '{{if .Update}}{{.Path}}: {{.Version}} -> {{.Update.Version}}{{end}}' \
            github.com/blaktron/agentry github.com/blaktron/agentry-cli)
          if [ -n "$behind" ]; then
            echo "$behind"
            msg="A pinned dependency is behind its default branch; a release built from it could not read a file the current CLI writes (desktop#60). Bump with: go get github.com/blaktron/agentry@main github.com/blaktron/agentry-cli@main, merge, then tag."
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then echo "::warning::dry run on stale pins: $msg"; else echo "::error::$msg"; exit 1; fi
          else
            echo "pins are current"
          fi
      # A tag can land on a commit whose ci run never happened, and both
      # build jobs ship the checked-in bindings without regenerating them,
      # so the release checks for itself that those bindings are what the Go
      # types generate (desktop#97).
      - name: Install the wails CLI at the version go.mod pins
        run: go install "github.com/wailsapp/wails/v2/cmd/wails@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"
      - name: The checked-in bindings are current
        run: |
          set -euo pipefail
          make bindings
          drift=$(git status --porcelain -- frontend/wailsjs)
          if [ -n "$drift" ]; then echo "$drift"; echo "::error::the checked-in bindings differ from what the Go types generate: run make bindings, commit, then tag"; exit 1; fi
          echo "bindings are current"
      - name: Remove the job-scoped git credential
        if: always()
        run: rm -f "$RUNNER_TEMP/gitconfig"

  # Windows is cross-built by the wails CLI (DEV-097) and its per-user
  # installer by makensis from build/windows/installer/project.nsi
  # (desktop#83; the ci workflow's windows job does the same on every PR);
  # Linux is built inside a Debian container carrying the GTK and WebKit
  # headers the runner image does not (scripts/build-linux.sh), then wrapped
  # in a .deb and an .rpm by nfpm (desktop#84), from the
  # tree vendored here with the job's credential — the container itself gets
  # no credential: the checkout token is not persisted and the job-scoped
  # git config is not mounted. The Windows artifacts are Authenticode-signed
  # here (agentry-desktop#54); the Linux ones carry no OS signature.
  linux-windows:
    needs: preflight
    runs-on: [self-hosted, linux, x64]
    # The `release` environment is what the Windows signing credential is
    # scoped to (agentry-desktop#151, #54; plan os-code-signing.md D6): the
    # Entra federated credential matches a job of this repository in this
    # environment and nothing else, and the environment admits only main and
    # v* tags, so a dry run starts from main or a tag or does not start.
    # id-token lets the job mint the OIDC token it exchanges; contents: read
    # is what checkout needs and is repeated here because a job-level
    # permissions block replaces the workflow's.
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    outputs:
      signed_windows: ${{ steps.package.outputs.signed_windows }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          # Shared persistent host module cache; see preflight (agentry#225).
          cache: false
      - name: Authenticate for the private blaktron modules (job-scoped)
        env:
          AGENTRY_BUILD_TOKEN: ${{ secrets.AGENTRY_BUILD_TOKEN }}
        run: |
          set -euo pipefail
          echo "GIT_CONFIG_GLOBAL=$RUNNER_TEMP/gitconfig" >> "$GITHUB_ENV"
          echo "GOPRIVATE=github.com/blaktron/*" >> "$GITHUB_ENV"
          git config --file "$RUNNER_TEMP/gitconfig" url."https://x-access-token:${AGENTRY_BUILD_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: What this release bakes in
        run: |
          set -euo pipefail
          set -a; . build/release.env; set +a
          : "${AGENTRY_DEFAULT_REGISTRY:?build/release.env must set AGENTRY_DEFAULT_REGISTRY}"
          echo "AGENTRY_DEFAULT_REGISTRY=${AGENTRY_DEFAULT_REGISTRY}" >> "$GITHUB_ENV"
          # The update channel is the same site's downloads manifest: on
          # SecureAgentry the edge serves the registry and the downloads from
          # one host (plan §7, D5), so one line decides both and they cannot
          # drift apart. A build that baked a registry but no channel would
          # check nothing and say nothing, which is the quietest way for this
          # feature not to exist (agentry-desktop#87).
          echo "AGENTRY_UPDATE_CHANNEL=${AGENTRY_DEFAULT_REGISTRY%/}/downloads/manifest.json" >> "$GITHUB_ENV"
          echo "EXTRA_LDFLAGS=-w -s -X github.com/blaktron/agentry-desktop/internal/settings.DefaultRegistryURL=${AGENTRY_DEFAULT_REGISTRY} -X github.com/blaktron/agentry-desktop/internal/selfupdate.ManifestURL=${AGENTRY_DEFAULT_REGISTRY%/}/downloads/manifest.json" >> "$GITHUB_ENV"
          # The CN the Windows signature must carry, when release.env names
          # one (agentry-desktop#54): the installer check refuses any other.
          [ -z "${AGENTRY_WINDOWS_SIGNING_CN:-}" ] || echo "AGENTRY_WINDOWS_SIGNING_CN=${AGENTRY_WINDOWS_SIGNING_CN}" >> "$GITHUB_ENV"
      - name: Build the embedded frontend bundle
        run: cd frontend && npm ci --no-audit --no-fund && npx tsc --noEmit && npx vite build
      - name: Install the wails CLI at the version go.mod pins
        run: go install "github.com/wailsapp/wails/v2/cmd/wails@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"
      # The installer's toolchain, from Ubuntu's packages: the runner
      # container runs as root and keeps them until it is recreated (see the
      # ci workflow's windows job).
      - name: makensis, 7z, java, osslsigncode, jq and openssl from Ubuntu's packages
        run: |
          set -euo pipefail
          if ! command -v makensis >/dev/null || ! command -v 7z >/dev/null || ! command -v java >/dev/null || ! command -v osslsigncode >/dev/null || ! command -v jq >/dev/null || ! command -v openssl >/dev/null; then
            sudo=""; [ "$(id -u)" = 0 ] || sudo=sudo
            $sudo apt-get update -qq
            $sudo apt-get install -y -qq --no-install-recommends nsis p7zip-full default-jre-headless osslsigncode jq openssl
          fi
          makensis -VERSION; 7z | sed -n 2p; java -version 2>&1 | sed -n 1p; osslsigncode --version 2>&1 | sed -n 1p
      # jsign, the signer, at the version and digest scripts/sign-windows.sh
      # pins; a jar with another digest is refused before it runs.
      - name: jsign at the pinned digest
        run: scripts/sign-windows.sh fetch "$RUNNER_TEMP"
      # Authenticode (agentry-desktop#54; plan os-code-signing.md §4), in
      # three make targets so the signing token reaches the signer and
      # nothing else. build-windows: wails builds the exe (and, as a side
      # effect of -nsis, an unsigned installer, the WebView2 bootstrapper and
      # wails_tools.nsh). -m: no go mod tidy (the module graph is already
      # resolved); -s: the frontend bundle was just built; -skipbindings: the
      # checked-in TypeScript bindings stay as they are; VERSION overrides
      # the Makefile's own describe so every job names one version.
      - name: Windows amd64 exe (wails)
        run: PATH="$HOME/go/bin:$PATH" make build-windows VERSION="$VERSION" WAILS_FLAGS='-m -s -skipbindings' EXTRA_LDFLAGS="$EXTRA_LDFLAGS"
      # sign-windows: the job proves who it is with the OIDC token GitHub
      # minted for it and gets an Azure access token for the signing service
      # in return (scripts/signing-token.sh, the exchange the
      # signing-oidc-probe workflow proves on its own: no Azure secret, both
      # tokens via curl's stdin config, never argv). The access token is
      # masked, lives in this step's shell, and reaches jsign through the
      # environment of this one make target (`--storepass env:`), so it is
      # in no process listing and touches no build tool. The target signs
      # the exe before makensis embeds it, and makensis signs the installer
      # and the uninstaller through project.nsi's hooks. There is no
      # unsigned fallback: a missing variable, a refused exchange, a jsign
      # failure or a signer that exits non-zero fails the release.
      - name: Sign the exe, then the installer and its uninstaller (Artifact Signing over OIDC)
        env:
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
        run: |
          set -euo pipefail
          for v in AZURE_TENANT_ID AZURE_CLIENT_ID ARTIFACT_SIGNING_ENDPOINT ARTIFACT_SIGNING_ACCOUNT ARTIFACT_SIGNING_PROFILE; do
            [ -n "${!v:-}" ] || { echo "::error::the $v repository variable is not set: run scripts/operator/artifact-signing-setup.sh (agentry-desktop#151)"; exit 1; }
          done
          token=$(scripts/signing-token.sh) || { echo "::error::no signing token: the release environment's federated credential (agentry-desktop#151) must match this job's OIDC subject"; exit 1; }
          [ -n "$token" ] || { echo "::error::signing-token.sh printed no token"; exit 1; }
          echo "::add-mask::$token"
          echo "signing as $ARTIFACT_SIGNING_ACCOUNT/$ARTIFACT_SIGNING_PROFILE at $ARTIFACT_SIGNING_ENDPOINT"
          AGENTRY_SIGNING_TOKEN="$token" JSIGN_JAR="$RUNNER_TEMP/jsign.jar" \
            make sign-windows VERSION="$VERSION" SIGN_CMD=scripts/sign-windows.sh
      # finish-windows: the zip and the setup name, then
      # scripts/check-windows-installer.sh --signed verifies all three
      # signatures to the pinned Microsoft root, insists on the timestamp,
      # and writes the report this job hands the bundle for BUILD-INFO.
      - name: "Windows package: zip, setup name, and the signed read-back"
        id: package
        env:
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
        run: |
          set -euo pipefail
          make finish-windows VERSION="$VERSION" SIGN_CMD=scripts/sign-windows.sh
          [ -f build/bin/windows-signing.txt ] || { echo "::error::the installer check wrote no signing report"; exit 1; }
          cn=$(sed -n 's/^cn=//p' build/bin/windows-signing.txt); ts=$(sed -n 's/^timestamp=//p' build/bin/windows-signing.txt); root=$(sed -n 's/^root=//p' build/bin/windows-signing.txt)
          [ -n "$cn" ] && [ -n "$ts" ] && [ -n "$root" ] || { cat build/bin/windows-signing.txt; echo "::error::the signing report is incomplete"; exit 1; }
          # The grammar the site's importer reads (agentry-web#187): the
          # tokens, in this order, each `key=value` with the value running to
          # the next known key; CN, timestamp and root carry spaces.
          echo "signed_windows=authenticode CN=$cn profile=$ARTIFACT_SIGNING_ACCOUNT/$ARTIFACT_SIGNING_PROFILE timestamp=$ts verified=osslsigncode root=$root" >> "$GITHUB_OUTPUT"
          cat build/bin/windows-signing.txt
      # The binary, then the .deb and .rpm from build/nfpm/nfpm.yaml
      # (desktop#84): the bare binary stays as its own artifact.
      - name: Linux amd64 binary and packages, in the container that carries the GTK headers
        run: |
          set -euo pipefail
          GOWORK=off go mod vendor
          make package-linux VERSION="$VERSION" EXTRA_LDFLAGS="$EXTRA_LDFLAGS"
      # Each package installed in a clean container of its family: the
      # declared dependencies are exactly what the binary links, the app
      # starts under Xvfb, and a populated home survives reinstall and
      # removal. A red here is a package that would not install or would
      # reach where it must not; it is not skipped for a release.
      - name: Install smoke of the .deb (Debian) and the .rpm (Fedora)
        run: make smoke-linux-packages VERSION="$VERSION"
      - name: Stage the artifacts, and check the bake reached them
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "build/bin/agentry-desktop-$VERSION-windows-amd64.exe" "build/bin/agentry-desktop-$VERSION-windows-amd64.zip" "build/bin/agentry-desktop-$VERSION-windows-amd64-setup.exe" "build/linux/agentry-desktop-$VERSION-linux-amd64" "build/linux/agentry-desktop-$VERSION-linux-amd64.deb" "build/linux/agentry-desktop-$VERSION-linux-amd64.rpm" dist/
          # -X on a symbol that moved fails silently; the URL must be in the binaries.
          for f in dist/agentry-desktop-"$VERSION"-linux-amd64 dist/agentry-desktop-"$VERSION"-windows-amd64.exe; do
            grep -q -a -F "$AGENTRY_DEFAULT_REGISTRY" "$f" || { echo "::error::$f does not carry $AGENTRY_DEFAULT_REGISTRY"; exit 1; }
            grep -q -a -F "$AGENTRY_UPDATE_CHANNEL" "$f" || { echo "::error::$f does not carry the update channel $AGENTRY_UPDATE_CHANNEL, so it would never look for a newer release"; exit 1; }
          done
          # The installer carries the same exe (make package-windows checked
          # the bytes) and the deb and rpm carry the same Linux binary (the
          # smoke compared them); the bake reaches them through those
          # binaries, compressed, so the checks above are the ones that prove it.
          ls -la dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-linux-windows
          path: dist/*
          if-no-files-found: error
          retention-days: 7
      - name: Remove the job-scoped git credential
        if: always()
        run: rm -f "$RUNNER_TEMP/gitconfig"

  # The one target that cannot be cross-built (D-021, agentry-desktop#57):
  # the universal bundle is built on the estate's Mac, the same way the ci
  # workflow's macos job does, with the release's version and linker flags,
  # and wrapped in both the zip and the dmg the download page offers
  # (agentry-desktop#85). Unsigned and ad-hoc (D-001, agentry-desktop#6).
  macos:
    needs: preflight
    runs-on: [self-hosted, macOS, ARM64]
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # A persistent, non-container runner: caches live in stable places under
      # the runner user's home rather than accumulating per job, and nothing
      # here is restored over them. The wails CLI goes on PATH from ~/go/bin.
      - name: Pin the caches and PATH
        run: |
          mkdir -p "$HOME/runner-cache/go-mod" "$HOME/runner-cache/go-build" "$HOME/runner-cache/npm"
          {
            echo "GOMODCACHE=$HOME/runner-cache/go-mod"
            echo "GOCACHE=$HOME/runner-cache/go-build"
            echo "npm_config_cache=$HOME/runner-cache/npm"
            echo "GOPRIVATE=github.com/blaktron/*"
            echo "GIT_CONFIG_GLOBAL=$RUNNER_TEMP/gitconfig"
          } >> "$GITHUB_ENV"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      # Job-scoped on this persistent host (see ci.yaml): removed at the end.
      - name: Authenticate for the private blaktron modules (job-scoped)
        env:
          AGENTRY_BUILD_TOKEN: ${{ secrets.AGENTRY_BUILD_TOKEN }}
        run: |
          git config --file "$GIT_CONFIG_GLOBAL" url."https://x-access-token:${AGENTRY_BUILD_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: What this release bakes in
        run: |
          set -euo pipefail
          set -a; . build/release.env; set +a
          : "${AGENTRY_DEFAULT_REGISTRY:?build/release.env must set AGENTRY_DEFAULT_REGISTRY}"
          echo "AGENTRY_DEFAULT_REGISTRY=${AGENTRY_DEFAULT_REGISTRY}" >> "$GITHUB_ENV"
          # The update channel is the same site's downloads manifest: on
          # SecureAgentry the edge serves the registry and the downloads from
          # one host (plan §7, D5), so one line decides both and they cannot
          # drift apart. A build that baked a registry but no channel would
          # check nothing and say nothing, which is the quietest way for this
          # feature not to exist (agentry-desktop#87).
          echo "AGENTRY_UPDATE_CHANNEL=${AGENTRY_DEFAULT_REGISTRY%/}/downloads/manifest.json" >> "$GITHUB_ENV"
          echo "EXTRA_LDFLAGS=-w -s -X github.com/blaktron/agentry-desktop/internal/settings.DefaultRegistryURL=${AGENTRY_DEFAULT_REGISTRY} -X github.com/blaktron/agentry-desktop/internal/selfupdate.ManifestURL=${AGENTRY_DEFAULT_REGISTRY%/}/downloads/manifest.json" >> "$GITHUB_ENV"
      - name: Install the wails CLI at the version go.mod pins
        run: go install "github.com/wailsapp/wails/v2/cmd/wails@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"
      # -skipbindings: the checked-in bindings, checked current in
      # preflight, are what ships; a release never regenerates them
      # (desktop#97). -m: skip wails' own go mod tidy.
      # package-darwin builds the bundle, the zip and the dmg, and reads the
      # dmg back (scripts/check-darwin-dmg.sh: it mounts, holds the bundle
      # and an Applications shortcut, is universal, its signature verifies,
      # and it is the same bundle the zip carries).
      - name: Build the universal bundle, its zip and its dmg
        run: |
          set -euo pipefail
          make package-darwin VERSION="$VERSION" WAILS_FLAGS='-m -skipbindings' EXTRA_LDFLAGS="$EXTRA_LDFLAGS"
          lipo -info build/bin/agentry-desktop.app/Contents/MacOS/agentry-desktop
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/bin/agentry-desktop.app/Contents/Info.plist
          grep -q -a -F "$AGENTRY_DEFAULT_REGISTRY" build/bin/agentry-desktop.app/Contents/MacOS/agentry-desktop || { echo "::error::the bundle does not carry $AGENTRY_DEFAULT_REGISTRY"; exit 1; }
          grep -q -a -F "$AGENTRY_UPDATE_CHANNEL" build/bin/agentry-desktop.app/Contents/MacOS/agentry-desktop || { echo "::error::the bundle does not carry the update channel $AGENTRY_UPDATE_CHANNEL, so it would never look for a newer release"; exit 1; }
      # Uploaded before the smoke, not after: a smoke that goes red fails the
      # release, and that is exactly when someone wants the image to look at.
      # The bundle job needs this one to have succeeded, so nothing a failed
      # run uploaded can reach a release.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-darwin
          path: |
            build/bin/agentry-desktop-${{ needs.preflight.outputs.version }}-darwin-universal.zip
            build/bin/agentry-desktop-${{ needs.preflight.outputs.version }}-darwin-universal.dmg
          if-no-files-found: error
          retention-days: 7
      # Dragging the bundle onto Applications over a copy already there leaves
      # the settings, the installed agents, the pinned key, the runner policy
      # and a keychain item byte-identical (plan §8), and the bundle installed
      # from the image launches where a console session allows it. The keychain
      # half uses a keychain the script creates inside its own temporary
      # directory and names explicitly, so it runs on this runner too, which
      # has no login keychain at all (#106). This step gates a release: a red
      # here is a release that does not complete.
      - name: Install-over-install smoke of the dmg
        run: make smoke-darwin-dmg VERSION="$VERSION"
      # Applying a newer Agentry Desktop: the bundle swap, that the person's
      # configuration is byte-identical afterwards, and that a copy they
      # cannot replace is refused rather than elevated (agentry-desktop#88).
      # The relaunch is not proven here — it needs a console session, which
      # this runner has not got (#106) — and the script says so.
      - name: Self-update bundle-swap acceptance
        run: make smoke-darwin-selfupdate VERSION="$VERSION"
      - name: Remove the job-scoped git credential
        if: always()
        run: rm -f "$GIT_CONFIG_GLOBAL"

  # One bundle: every platform artifact, BUILD-INFO saying what built it and
  # what it bakes in, SHA256SUMS covering all of them — every file but
  # SHA256SUMS itself is in the sums, and every artifact the release matrix
  # names is present — and SHA256SUMS.minisig, the estate's own signature over
  # those sums (agentry-desktop#86; plan §7, D5; register D-026). Kept 90 days
  # (the artifact store's default here; the site's downloads directory is the
  # long-lived copy, plan §6).
  bundle:
    needs: [preflight, linux-windows, macos]
    runs-on: [self-hosted, linux, x64]
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          # Shared persistent host module cache; see preflight (agentry#225).
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          merge-multiple: true
          path: bundle
      - name: BUILD-INFO
        env:
          SIGNED_WINDOWS: ${{ needs.linux-windows.outputs.signed_windows }}
        run: |
          set -euo pipefail
          set -a; . build/release.env; set +a
          {
            echo "product=agentry-desktop"
            echo "version=$VERSION"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "ref=${GITHUB_REF}"
            echo "commit=${GITHUB_SHA}"
            echo "default_registry=${AGENTRY_DEFAULT_REGISTRY}"
            # signed= is true only when EVERY artifact is OS-signed; the
            # per-platform lines say which are. Windows since #54; macOS is
            # #6, so until it lands this stays false and the page keeps
            # saying so for the macOS artifacts.
            echo "signed=false"
            : "${SIGNED_WINDOWS:?the linux-windows job reported no Windows signature, and a release without one does not complete}"
            echo "signed_windows=${SIGNED_WINDOWS}"
            echo "built_by=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > bundle/BUILD-INFO
          cat bundle/BUILD-INFO
      - name: SHA256SUMS over every file, and every platform present
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd bundle
          files=(*)
          [ "${#files[@]}" -gt 0 ] || { echo "::error::the bundle is empty"; exit 1; }
          for f in "${files[@]}"; do
            case "$f" in BUILD-INFO|agentry-desktop-"$VERSION"-*) ;; *) echo "::error::$f is not an artifact of $VERSION"; exit 1;; esac
          done
          sha256sum "${files[@]}" > SHA256SUMS
          sha256sum -c SHA256SUMS
          for f in *; do [ "$f" = SHA256SUMS ] || grep -q " $f\$" SHA256SUMS || { echo "::error::$f is not covered by SHA256SUMS"; exit 1; }; done
          # The release matrix, as the site's download page lists it.
          for want in linux-amd64 linux-amd64.deb linux-amd64.rpm windows-amd64.exe windows-amd64.zip windows-amd64-setup.exe darwin-universal.zip darwin-universal.dmg; do
            [ -f "agentry-desktop-$VERSION-$want" ] || { echo "::error::agentry-desktop-$VERSION-$want is missing"; exit 1; }
          done
          cat SHA256SUMS
      # The estate's own signature over those sums — the trust root the app's
      # self-update checks before it touches a byte (plan §3, §7, D5). It is
      # OUR key, not the operating system's: independent of Developer ID (#6)
      # and Authenticode (#54), which secure a different thing.
      #
      # internal/cmd/signrelease signs and then verifies what it wrote against
      # the COMMITTED key set, with the same code the application uses, so a
      # release cannot be published whose signature a shipped app would refuse
      # — the mistake rotation invites, a new secret without the matching
      # public half committed.
      #
      # Where the key goes, precisely, because the loose version of this
      # sentence is the kind that ages into a lie. The secret is an env var on
      # THIS STEP, as an Actions secret must be to reach a step at all. From
      # there it is piped on standard input to signrelease and never written to
      # disk, so nothing on the runner host holds it and no later step could
      # read a file it left; `env -u` drops it from the signing process's own
      # environment, so the compiled child and anything it might run cannot
      # read it either. It reaches no flag, so it is not in a process listing.
      # After this step ends, the variable is gone with the step's shell.
      #
      # SHA256SUMS.minisig is deliberately NOT inside SHA256SUMS: a signature
      # cannot cover itself. The completeness loop above ran before this step,
      # which is why it does not have to know about it.
      - name: Sign SHA256SUMS with the estate's update-signing key
        env:
          AGENTRY_UPDATE_SIGNING_KEY: ${{ secrets.AGENTRY_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${AGENTRY_UPDATE_SIGNING_KEY}" ]; then
            msg="No AGENTRY_UPDATE_SIGNING_KEY secret, so this release could not be signed and no app would install it. Run scripts/operator/update-signing-key.sh to create the key, load the secret and commit the public half (agentry-desktop#86, #110)."
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              echo "::warning::dry run without a signing key: $msg"
              exit 0
            fi
            echo "::error::$msg"; exit 1
          fi
          # Built first, so that `go run`'s own compile output cannot interleave
          # with the key on the pipe, and so the pipeline below is one process
          # reading one thing.
          go build -o "$RUNNER_TEMP/signrelease" ./internal/cmd/signrelease
          printf '%s' "${AGENTRY_UPDATE_SIGNING_KEY}" \
            | env -u AGENTRY_UPDATE_SIGNING_KEY "$RUNNER_TEMP/signrelease" \
                -key - \
                -in bundle/SHA256SUMS \
                -version "$VERSION" \
                -commit "${GITHUB_SHA}"
          ls -la bundle/SHA256SUMS.minisig
          cat bundle/SHA256SUMS.minisig
      - name: Remove the signing binary
        if: always()
        run: rm -f "$RUNNER_TEMP/signrelease"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agentry-desktop-${{ needs.preflight.outputs.version }}
          path: bundle/
          if-no-files-found: error
          retention-days: 90
