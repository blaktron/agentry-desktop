# CI gate for the desktop client: frontend type-check + the dist bundle the
# Go binary embeds, then gofmt/vet/lint/tests/build (`make check`), and
# dependency hygiene. No wails CLI or webkit2gtk needed — the checks compile
# the app library, not the platform bundle.
name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per ref: a new push to a PR cancels the superseded run (self-hosted
# capacity is a handful of runners, not a cloud).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # The runner shares one persistent host module cache with every other
          # runner; restoring the Actions cache over it is slow and left partial
          # modules that broke `go mod verify` in the core (agentry#225).
          cache: false
      # The blaktron modules are private; the runner needs credentials to
      # fetch github.com/blaktron/agentry. The token never lands in the repo.
      - name: Authenticate for the private blaktron modules
        env:
          AGENTRY_BUILD_TOKEN: ${{ secrets.AGENTRY_BUILD_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${AGENTRY_BUILD_TOKEN}@github.com/".insteadOf "https://github.com/"
          go env -w GOPRIVATE='github.com/blaktron/*'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # main.go embeds frontend/dist, so every Go tool — including the lint
      # typecheck below — needs the bundle built first on a fresh tree.
      - name: Build the embedded frontend bundle
        run: cd frontend && npm ci --no-audit --no-fund && npx tsc --noEmit && npx vite build
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
      - name: make check
        run: make check

  govulncheck:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # The runner shares one persistent host module cache with every other
          # runner; restoring the Actions cache over it is slow and left partial
          # modules that broke `go mod verify` in the core (agentry#225).
          cache: false
      - name: Authenticate for the private blaktron modules
        env:
          AGENTRY_BUILD_TOKEN: ${{ secrets.AGENTRY_BUILD_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${AGENTRY_BUILD_TOKEN}@github.com/".insteadOf "https://github.com/"
          go env -w GOPRIVATE='github.com/blaktron/*'
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
