# CI gate for the desktop client: frontend type-check + the dist bundle the
# Go binary embeds, then gofmt/vet/lint/tests/build (`make check`), and
# dependency hygiene, on the Linux runners — no wails CLI or webkit2gtk
# needed, they compile the app library, not the platform bundle. Two jobs
# build a platform package: `windows` cross-builds the Windows target and
# its per-user installer on the Linux runner (a broken Windows build fails
# the gate, desktop#53/#83), and `macos` builds the universal bundle on the
# Mac.
name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per ref: a new push to a PR cancels the superseded run (self-hosted
# capacity is a handful of runners, not a cloud).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          # Nothing after the checkout fetches with its token; the private
          # modules go through the job-scoped rewrite below.
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # The runner shares one persistent host module cache with every other
          # runner; restoring the Actions cache over it is slow and left partial
          # modules that broke `go mod verify` in the core (agentry#225).
          cache: false
      # The blaktron modules are private. The rewrite that carries the token
      # goes into a job-scoped git config file, removed at the end, so nothing
      # persists in the runner's home between jobs (desktop#92; the release
      # workflow has done this since #93).
      - name: Authenticate for the private blaktron modules (job-scoped)
        env:
          AGENTRY_BUILD_TOKEN: ${{ secrets.AGENTRY_BUILD_TOKEN }}
        run: |
          set -euo pipefail
          echo "GIT_CONFIG_GLOBAL=$RUNNER_TEMP/gitconfig" >> "$GITHUB_ENV"
          echo "GOPRIVATE=github.com/blaktron/*" >> "$GITHUB_ENV"
          git config --file "$RUNNER_TEMP/gitconfig" url."https://x-access-token:${AGENTRY_BUILD_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # main.go embeds frontend/dist, so every Go tool — including the lint
      # typecheck below — needs the bundle built first on a fresh tree.
      - name: Build the embedded frontend bundle
        run: cd frontend && npm ci --no-audit --no-fund && npx tsc --noEmit && npx vite build
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
      - name: make check
        run: make check
      # The honest posture, as a check (plan hosted-runs.md §3): the app
      # says what ran and what was enforced, never "safe" or "secure".
      # `make check` runs it too; it is its own step so a copy failure is
      # obvious in the checks list.
      - name: desktop copy check
        run: ./scripts/copy-check.sh --self-test && ./scripts/copy-check.sh
      # No client takes money (plan subscription-tiers.md D12): the app shows
      # a tier and a balance and opens the site to upgrade.
      - name: no payment provider in the app
        run: |
          if grep -rIi -n 'stripe' --include='*.go' --include='*.ts' --include='*.tsx' --exclude-dir=vendor --exclude-dir=node_modules --exclude-dir=dist . ; then echo "::error::a payment provider reached the desktop"; exit 1; fi
      # Generated code is regenerated, never hand-edited, and a stale copy
      # is a build that fails somewhere else (the Mac's wails build
      # regenerated models.ts and could not type-check it, desktop#97). The
      # wails CLI at the version go.mod pins regenerates here; any modified
      # or new file under the bindings tree is the failure. Last, because it
      # rewrites the tree.
      - name: Install the wails CLI at the version go.mod pins
        run: go install "github.com/wailsapp/wails/v2/cmd/wails@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"
      - name: Bindings drift
        run: |
          set -euo pipefail
          make bindings
          drift=$(git status --porcelain -- frontend/wailsjs)
          if [ -n "$drift" ]; then echo "$drift"; echo "::error::the checked-in bindings differ from what the Go types generate: run make bindings and commit"; exit 1; fi
          echo "bindings are current"
      - name: Remove the job-scoped git credential
        if: always()
        run: rm -f "$RUNNER_TEMP/gitconfig"

  # The Windows target and its per-user installer, cross-built on the Linux
  # runner the way the release workflow does it (desktop#83, absorbing #53):
  # a change that breaks the Windows build, or the installer, turns this
  # red. makensis and 7z come from Ubuntu's packages; the runner container
  # runs as root and keeps them until it is recreated, so the install is a
  # one-off per container (the runner image itself carries neither).
  # scripts/check-windows-installer.sh reads the installer back — asInvoker,
  # two installed files, the same binary as the zip — which is as far as
  # Linux can check a Windows package; the install-over-install check is by
  # hand until #55 gives CI a Windows machine. The package is kept as a
  # workflow artifact so a PR's Windows build can be tried without a release.
  windows:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # Shared persistent host module cache; see check (agentry#225).
          cache: false
      - name: Authenticate for the private blaktron modules (job-scoped)
        env:
          AGENTRY_BUILD_TOKEN: ${{ secrets.AGENTRY_BUILD_TOKEN }}
        run: |
          set -euo pipefail
          echo "GIT_CONFIG_GLOBAL=$RUNNER_TEMP/gitconfig" >> "$GITHUB_ENV"
          echo "GOPRIVATE=github.com/blaktron/*" >> "$GITHUB_ENV"
          git config --file "$RUNNER_TEMP/gitconfig" url."https://x-access-token:${AGENTRY_BUILD_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: makensis and 7z from Ubuntu's packages
        run: |
          set -euo pipefail
          if ! command -v makensis >/dev/null || ! command -v 7z >/dev/null; then
            sudo=""; [ "$(id -u)" = 0 ] || sudo=sudo
            $sudo apt-get update -qq
            $sudo apt-get install -y -qq --no-install-recommends nsis p7zip-full
          fi
          makensis -VERSION; 7z | sed -n 2p
      - name: Build the embedded frontend bundle
        run: cd frontend && npm ci --no-audit --no-fund && npx vite build
      - name: Install the wails CLI at the version go.mod pins
        run: go install "github.com/wailsapp/wails/v2/cmd/wails@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"
      # The Go side first, on its own: vet for the Windows target says which
      # file broke it, where a wails failure says only that it did.
      - name: go vet for windows/amd64
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go vet ./...
      - name: Windows amd64 package and per-user installer (unsigned)
        run: PATH="$HOME/go/bin:$PATH" make package-windows WAILS_FLAGS='-m -s -skipbindings'
      # wails build -nsis rewrites wails_tools.nsh from wails.json on every
      # build; the checked-in copy is that output, so a productVersion bump
      # that forgot to rebuild shows up here, not as a -dirty tree at release.
      - name: The checked-in NSIS tools file is what the build writes
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- build/windows/installer/wails_tools.nsh; then
            echo "::error::build/windows/installer/wails_tools.nsh differs from what wails build -nsis writes for this wails.json: run make package-windows and commit the file"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: agentry-desktop-windows-amd64
          path: |
            build/bin/agentry-desktop-*-windows-amd64-setup.exe
            build/bin/agentry-desktop-*-windows-amd64.zip
          if-no-files-found: error
          retention-days: 7
      - name: Remove the job-scoped git credential
        if: always()
        run: rm -f "$RUNNER_TEMP/gitconfig"

  govulncheck:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # The runner shares one persistent host module cache with every other
          # runner; restoring the Actions cache over it is slow and left partial
          # modules that broke `go mod verify` in the core (agentry#225).
          cache: false
      # The blaktron modules are private. The rewrite that carries the token
      # goes into a job-scoped git config file, removed at the end, so nothing
      # persists in the runner's home between jobs (desktop#92; the release
      # workflow has done this since #93).
      - name: Authenticate for the private blaktron modules (job-scoped)
        env:
          AGENTRY_BUILD_TOKEN: ${{ secrets.AGENTRY_BUILD_TOKEN }}
        run: |
          set -euo pipefail
          echo "GIT_CONFIG_GLOBAL=$RUNNER_TEMP/gitconfig" >> "$GITHUB_ENV"
          echo "GOPRIVATE=github.com/blaktron/*" >> "$GITHUB_ENV"
          git config --file "$RUNNER_TEMP/gitconfig" url."https://x-access-token:${AGENTRY_BUILD_TOKEN}@github.com/".insteadOf "https://github.com/"
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Remove the job-scoped git credential
        if: always()
        run: rm -f "$RUNNER_TEMP/gitconfig"

  # The one target that cannot be cross-built (agentry-desktop#57): the
  # universal bundle is built on the estate's Mac, the Go tests run natively,
  # the Keychain path is exercised, and the built app is launched when the
  # runner's user has a console session. Not a required check yet: the runner
  # is new and one machine, so its failure is visible but does not block.
  macos:
    runs-on: [self-hosted, macOS, ARM64]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # A persistent, non-container runner: caches live in stable places under
      # the runner user's home rather than accumulating per job, and nothing
      # here is restored over them. The wails CLI goes on PATH from ~/go/bin.
      - name: Pin the caches and PATH
        run: |
          mkdir -p "$HOME/runner-cache/go-mod" "$HOME/runner-cache/go-build" "$HOME/runner-cache/npm"
          {
            echo "GOMODCACHE=$HOME/runner-cache/go-mod"
            echo "GOCACHE=$HOME/runner-cache/go-build"
            echo "npm_config_cache=$HOME/runner-cache/npm"
            echo "GOPRIVATE=github.com/blaktron/*"
            echo "GIT_CONFIG_GLOBAL=$RUNNER_TEMP/gitconfig"
          } >> "$GITHUB_ENV"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      # The private blaktron modules need a credential to fetch. On this
      # persistent host it must not land in ~/.gitconfig, so the rewrite goes
      # into a job-scoped file (GIT_CONFIG_GLOBAL above) removed at the end.
      - name: Authenticate for the private blaktron modules (job-scoped)
        env:
          AGENTRY_BUILD_TOKEN: ${{ secrets.AGENTRY_BUILD_TOKEN }}
        run: |
          git config --file "$GIT_CONFIG_GLOBAL" url."https://x-access-token:${AGENTRY_BUILD_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: Install the wails CLI at the version go.mod pins
        run: go install "github.com/wailsapp/wails/v2/cmd/wails@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"
      # -skipbindings: the checked-in bindings are what the check job
      # type-checks and the drift step keeps current; a build never
      # regenerates them (desktop#97). -m: skip wails' own go mod tidy.
      # Derived once and passed to every step below, the way the release
      # workflow derives it once in preflight and for the same reason: a wails
      # build rewrites tracked files (frontend/package.json.md5 and the
      # runtime bindings), so the tree is dirty by the time the next step
      # runs, and a second `git describe` would say <sha>-dirty where the
      # first said <sha> — two names for one build, and the second step
      # looking for a file the first did not write.
      - name: The version this job names its artifacts for
        run: echo "VERSION=$(make -s version)" >> "$GITHUB_ENV"
      # package-darwin builds the bundle, the zip and the dmg, and reads the
      # dmg back (scripts/check-darwin-dmg.sh); this job is where that runs
      # on every change, since the Mac is the only host that can mount one.
      - name: Build the universal bundle, its zip and its dmg
        run: |
          make package-darwin VERSION="$VERSION" WAILS_FLAGS='-m -skipbindings'
          lipo -info build/bin/agentry-desktop.app/Contents/MacOS/agentry-desktop
          shasum -a 256 build/bin/*.zip build/bin/*.dmg
      # Uploaded before the smoke, not after: a smoke that goes red is exactly
      # when someone wants the image to look at.
      - uses: actions/upload-artifact@v4
        with:
          name: agentry-desktop-darwin-universal
          path: |
            build/bin/agentry-desktop-*-darwin-universal.zip
            build/bin/agentry-desktop-*-darwin-universal.dmg
          if-no-files-found: error
      # The dmg's promise about an upgrade: dragging the bundle over a copy
      # already there leaves the settings, the installed agents, the pinned
      # key, the runner policy and a keychain item byte-identical, and the
      # bundle installed from the image launches where a console session
      # allows it (agentry-desktop#85, plan §8).
      - name: Install-over-install smoke of the dmg
        run: make smoke-darwin-dmg VERSION="$VERSION"
      # The bundle swap and what survives it (agentry-desktop#88).
      - name: Self-update bundle-swap acceptance
        run: make smoke-darwin-selfupdate VERSION="$VERSION"
      # frontend/dist exists after the wails build, so the Go tools run on the
      # embedded bundle the app ships with.
      - name: Go tests, natively on macOS
        run: go test ./...
      - name: Keychain round trip
        run: AGENTRY_KEYCHAIN_TEST=1 go test ./internal/settings/ -run TestKeychainRoundTrip -v
      # A window needs the runner's user logged in at the console. Without a
      # session the smoke cannot run and says so; with one, the built app must
      # still be running after five seconds.
      - name: Launch smoke
        run: |
          if ! launchctl print "gui/$(id -u)" >/dev/null 2>&1; then
            echo "::warning::launch smoke skipped: no console session for $(id -un) on this runner"
            exit 0
          fi
          ./build/bin/agentry-desktop.app/Contents/MacOS/agentry-desktop >smoke.log 2>&1 & pid=$!
          sleep 5
          if kill -0 "$pid" 2>/dev/null; then
            echo "agentry-desktop running after 5 s"; kill "$pid"; wait "$pid" 2>/dev/null || true
          else
            wait "$pid"; ec=$?; echo "agentry-desktop exited with $ec before 5 s"; tail -20 smoke.log; exit 1
          fi
      - name: Remove the job-scoped git credential
        if: always()
        run: rm -f "$GIT_CONFIG_GLOBAL"
