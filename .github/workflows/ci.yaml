# CI gate for the desktop client: frontend type-check + the dist bundle the
# Go binary embeds, then gofmt/vet/lint/tests/build (`make check`), and
# dependency hygiene, on the Linux runners — no wails CLI or webkit2gtk
# needed, they compile the app library, not the platform bundle. Two jobs
# build a platform package: `windows` cross-builds the Windows target and
# its per-user installer on the Linux runner (a broken Windows build fails
# the gate, desktop#53/#83), and `macos` builds the universal bundle on the
# Mac. `gitleaks` scans the commits every event brings for secrets. Every
# job carries the fork guard (below), and every action is pinned to a commit
# SHA (agentry-desktop#128).
name: ci
on:
  push:
    # dev is the integration branch; main is production (WORKFLOW.md
    # "Branches", 2026-09-22).
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

# The CI tools' versions, in one place (agentry-desktop#128): no step installs
# anything unpinned, and scripts/pins-check.sh (the daily pins workflow)
# reads these lines to report newer releases. The wails CLI is pinned by
# go.mod instead (`go list -m`). GITLEAKS_SHA256 is the checksum of
# gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz from the release's own
# gitleaks_${GITLEAKS_VERSION}_checksums.txt.
env:
  GOLANGCI_LINT_VERSION: v2.14.0
  GOVULNCHECK_VERSION: v1.8.0
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

# One run per ref: a new push to a PR cancels the superseded run (self-hosted
# capacity is a handful of runners, not a cloud).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job carries the fork guard
#   if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
# (agentry-desktop#128; the estate's shape, agentry#419). This repository goes
# public at the 1.0 flip, and every job here runs on a persistent self-hosted
# runner (the Linux containers share one module cache with the release
# builders; the macOS job runs on the estate's Mac). A pull request from a
# fork would otherwise execute its own `run:` steps there. The guard lives in
# the file, where a diff shows it; the repository setting "Require approval
# for all external contributors" stays on as belt-and-braces (PUBLIC-FLIP.md
# item 5). A fork's pull request shows these jobs as skipped; a maintainer
# who wants it built pushes its commits to a branch here.
jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing after the checkout fetches with its token; the private
          # modules go through the job-scoped rewrite below.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The runner shares one persistent host module cache with every other
          # runner; restoring the Actions cache over it is slow and left partial
          # modules that broke `go mod verify` in the core (agentry#225).
          cache: false
      # The blaktron modules are private. The rewrite that carries the token
      # goes into a job-scoped git config file, removed at the end, so nothing
      # persists in the runner's home between jobs (desktop#92; the release
      # workflow has done this since #93).
      - name: Authenticate for the private blaktron modules (job-scoped)
        env:
          AGENTRY_BUILD_TOKEN: ${{ secrets.AGENTRY_BUILD_TOKEN }}
        run: |
          set -euo pipefail
          echo "GIT_CONFIG_GLOBAL=$RUNNER_TEMP/gitconfig" >> "$GITHUB_ENV"
          echo "GOPRIVATE=github.com/blaktron/*" >> "$GITHUB_ENV"
          git config --file "$RUNNER_TEMP/gitconfig" url."https://x-access-token:${AGENTRY_BUILD_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          # setup-node v5+ caches through GitHub's store on its own when
          # package.json names a package manager; the runners keep npm's cache
          # on the host instead (agentry-desktop#209).
          package-manager-cache: false
      # main.go embeds frontend/dist, so every Go tool — including the lint
      # typecheck below — needs the bundle built first on a fresh tree.
      - name: Build the embedded frontend bundle
        run: cd frontend && npm ci --no-audit --no-fund && npx tsc --noEmit && npx vite build
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          # The action's default saves ~/.cache/golangci-lint to GitHub's
          # Actions cache and restores it on top of what the persistent runner
          # container already keeps there; the runners keep their caches on the
          # host, not in GitHub's store (agentry#225, desktop#225). golangci-lint
          # falls back to its own ~/.cache/golangci-lint in the container.
          skip-cache: true
      - name: make check
        run: make check
      # A release from main bakes production's registry, one from dev bakes
      # dev's, and no other commit is a release (agentry-desktop#183, the
      # CLI's agentry-cli#240): scripts/release-registry.sh against a
      # throwaway origin with the estate's branch model.
      - name: release registry by branch
        run: scripts/acceptance/release-registry.sh
      # A tag's form must agree with the line its commit is on (vX.Y.Z on
      # main's, vX.Y.Z-dev.N on dev's), 1.x waits for AGENTRY_ALLOW_V1, and
      # the next tag follows the scheme (agentry-desktop#279; the CLI's
      # script and test, agentry-cli#327).
      - name: release tags by branch
        run: scripts/acceptance/release-tag.sh
      # The honest posture, as a check (plan hosted-runs.md §3): the app
      # says what ran and what was enforced, never "safe" or "secure".
      # `make check` runs it too; it is its own step so a copy failure is
      # obvious in the checks list.
      - name: desktop copy check
        run: ./scripts/copy-check.sh --self-test && ./scripts/copy-check.sh
      # No client takes money (plan subscription-tiers.md D12): the app shows
      # a tier and a balance and opens the site to upgrade.
      - name: no payment provider in the app
        run: |
          if grep -rIi -n 'stripe' --include='*.go' --include='*.ts' --include='*.tsx' --exclude-dir=vendor --exclude-dir=node_modules --exclude-dir=dist . ; then echo "::error::a payment provider reached the desktop"; exit 1; fi
      # Generated code is regenerated, never hand-edited, and a stale copy
      # is a build that fails somewhere else (the Mac's wails build
      # regenerated models.ts and could not type-check it, desktop#97). The
      # wails CLI at the version go.mod pins regenerates here; any modified
      # or new file under the bindings tree is the failure. Last, because it
      # rewrites the tree.
      - name: Install the wails CLI at the version go.mod pins
        run: go install "github.com/wailsapp/wails/v2/cmd/wails@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"
      - name: Bindings drift
        run: |
          set -euo pipefail
          make bindings
          drift=$(git status --porcelain -- frontend/wailsjs)
          if [ -n "$drift" ]; then echo "$drift"; echo "::error::the checked-in bindings differ from what the Go types generate: run make bindings and commit"; exit 1; fi
          echo "bindings are current"
      - name: Remove the job-scoped git credential
        if: always()
        run: rm -f "$RUNNER_TEMP/gitconfig"

  # The Windows target and its per-user installer, cross-built on the Linux
  # runner the way the release workflow does it (desktop#83, absorbing #53):
  # a change that breaks the Windows build, or the installer, turns this
  # red. makensis and 7z come from Ubuntu's packages; the runner container
  # runs as root and keeps them until it is recreated, so the install is a
  # one-off per container (the runner image itself carries neither).
  # scripts/check-windows-installer.sh reads the installer back — asInvoker,
  # two installed files, the same binary as the zip — which is as far as
  # Linux can check a Windows package; the install-over-install check is by
  # hand until #55 gives CI a Windows machine. A failed build's package is
  # kept for a week on the runner host that built it, not in GitHub's
  # artifact storage (scripts/ci-keep-build.sh, agentry-desktop#188); a
  # Windows build to try comes from a release dry run.
  windows:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Shared persistent host module cache; see check (agentry#225).
          cache: false
      - name: Authenticate for the private blaktron modules (job-scoped)
        env:
          AGENTRY_BUILD_TOKEN: ${{ secrets.AGENTRY_BUILD_TOKEN }}
        run: |
          set -euo pipefail
          echo "GIT_CONFIG_GLOBAL=$RUNNER_TEMP/gitconfig" >> "$GITHUB_ENV"
          echo "GOPRIVATE=github.com/blaktron/*" >> "$GITHUB_ENV"
          git config --file "$RUNNER_TEMP/gitconfig" url."https://x-access-token:${AGENTRY_BUILD_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          # setup-node v5+ caches through GitHub's store on its own when
          # package.json names a package manager; the runners keep npm's cache
          # on the host instead (agentry-desktop#209).
          package-manager-cache: false
      - name: makensis, 7z, osslsigncode and openssl from Ubuntu's packages
        run: |
          set -euo pipefail
          if ! command -v makensis >/dev/null || ! command -v 7z >/dev/null || ! command -v osslsigncode >/dev/null || ! command -v openssl >/dev/null; then
            sudo=""; [ "$(id -u)" = 0 ] || sudo=sudo
            $sudo apt-get update -qq
            $sudo apt-get install -y -qq --no-install-recommends nsis p7zip-full osslsigncode openssl
          fi
          makensis -VERSION; 7z | sed -n 2p; osslsigncode --version 2>&1 | sed -n 1p
      - name: Build the embedded frontend bundle
        run: cd frontend && npm ci --no-audit --no-fund && npx vite build
      - name: Install the wails CLI at the version go.mod pins
        run: go install "github.com/wailsapp/wails/v2/cmd/wails@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"
      # The Go side first, on its own: vet for the Windows target says which
      # file broke it, where a wails failure says only that it did.
      - name: go vet for windows/amd64
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go vet ./...
      - name: Windows amd64 package and per-user installer (unsigned)
        run: PATH="$HOME/go/bin:$PATH" make package-windows WAILS_FLAGS='-m -s -skipbindings'
      # The release signs (agentry-desktop#54); a PR proves the seam with a
      # throwaway CA instead of the key: the NSIS hooks sign the installer
      # and the uninstaller, the exe signed before makensis is the one
      # embedded, a failing signer fails the build, and the --signed check
      # accepts that set and refuses an unsigned exe, a foreign root and an
      # unexpected CN. It timestamps against a public TSA (two tried), so it
      # needs the network the rest of this job already needs.
      - name: Windows signing seam, with a throwaway CA
        run: scripts/acceptance/windows-signing.sh build/bin/agentry-desktop.exe
      # wails build -nsis rewrites wails_tools.nsh from wails.json on every
      # build; the checked-in copy is that output, so a productVersion bump
      # that forgot to rebuild shows up here, not as a -dirty tree at release.
      - name: The checked-in NSIS tools file is what the build writes
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- build/windows/installer/wails_tools.nsh; then
            echo "::error::build/windows/installer/wails_tools.nsh differs from what wails build -nsis writes for this wails.json: run make package-windows and commit the file"
            exit 1
          fi
      # No upload-artifact: GitHub's artifact storage is metered per account,
      # and PR builds filled it on 2026-09-24 (agentry-desktop#187, #188). A
      # failed build's installer and zip stay on this runner host for 7 days;
      # the step names the host and the path.
      - name: Keep a failed build on the runner host
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: scripts/ci-keep-build.sh "$JOB_STATUS" build/bin/agentry-desktop-*-windows-amd64-setup.exe build/bin/agentry-desktop-*-windows-amd64.zip
      - name: Remove the job-scoped git credential
        if: always()
        run: rm -f "$RUNNER_TEMP/gitconfig"

  govulncheck:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The runner shares one persistent host module cache with every other
          # runner; restoring the Actions cache over it is slow and left partial
          # modules that broke `go mod verify` in the core (agentry#225).
          cache: false
      # The blaktron modules are private. The rewrite that carries the token
      # goes into a job-scoped git config file, removed at the end, so nothing
      # persists in the runner's home between jobs (desktop#92; the release
      # workflow has done this since #93).
      - name: Authenticate for the private blaktron modules (job-scoped)
        env:
          AGENTRY_BUILD_TOKEN: ${{ secrets.AGENTRY_BUILD_TOKEN }}
        run: |
          set -euo pipefail
          echo "GIT_CONFIG_GLOBAL=$RUNNER_TEMP/gitconfig" >> "$GITHUB_ENV"
          echo "GOPRIVATE=github.com/blaktron/*" >> "$GITHUB_ENV"
          git config --file "$RUNNER_TEMP/gitconfig" url."https://x-access-token:${AGENTRY_BUILD_TOKEN}@github.com/".insteadOf "https://github.com/"
      - run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...
      - name: Remove the job-scoped git credential
        if: always()
        run: rm -f "$RUNNER_TEMP/gitconfig"

  # Secret scanning (agentry-desktop#128): gitleaks over the commits this
  # event brings — a pull request's own range, or a push's before..after —
  # with the repository's .gitleaks.toml, failing on any hit. The binary is
  # the release tarball at the pinned version, checked against the pinned
  # checksum before it runs (the runner image's copy is not relied on).
  # --redact: a hit names the file, line and rule, never the value.
  gitleaks:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks at the pinned version, checksum-verified
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/gitleaks" gitleaks
          "$RUNNER_TEMP/gitleaks/gitleaks" version
      - name: Scan the commits this event brings
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -n "$PUSH_BEFORE" ] && ! printf '%s' "$PUSH_BEFORE" | grep -qE '^0+$' && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            range="$PUSH_BEFORE..$PUSH_AFTER"
          else
            # A push with no usable "before" (a new branch, a force-push over
            # a commit this clone does not have): the whole history.
            range="$PUSH_AFTER"
          fi
          echo "scanning $range"
          "$RUNNER_TEMP/gitleaks/gitleaks" detect --source . --config .gitleaks.toml \
            --redact --no-banner --exit-code 1 --log-opts="$range"

  # The one target that cannot be cross-built (agentry-desktop#57): the
  # universal bundle is built on the estate's Mac, the Go tests run natively,
  # the Keychain path is exercised, and the built app is launched when the
  # runner's user has a console session. A required check since
  # agentry-desktop#109: it carries the dmg read-back and the
  # install-over-install smoke that gate a release (release.yaml's macos job),
  # so a change that breaks them must not merge on a green gate. The launch
  # smoke needs a console session and reports itself skipped without one;
  # the Keychain round trip runs against a throwaway default keychain the job
  # makes and removes (agentry-desktop#106), so it runs everywhere. The Mac being
  # offline leaves this job queued, so the run never concludes and the gate
  # ends in CI TIMEOUT, never CI GREEN and never CI NOT GREEN.
  macos:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A persistent host: the job token must not stay in .git/config
          # after the job (agentry-desktop#127). Nothing here fetches with it;
          # the private modules go through the job-scoped rewrite below.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          # setup-node v5+ caches through GitHub's store on its own when
          # package.json names a package manager; the runners keep npm's cache
          # on the host instead (agentry-desktop#209).
          package-manager-cache: false
      # A persistent, non-container runner: caches live in stable places under
      # the runner user's home rather than accumulating per job, and nothing
      # here is restored over them. The wails CLI goes on PATH from ~/go/bin.
      - name: Pin the caches and PATH
        run: |
          mkdir -p "$HOME/runner-cache/go-mod" "$HOME/runner-cache/go-build" "$HOME/runner-cache/npm"
          {
            echo "GOMODCACHE=$HOME/runner-cache/go-mod"
            echo "GOCACHE=$HOME/runner-cache/go-build"
            echo "npm_config_cache=$HOME/runner-cache/npm"
            echo "GOPRIVATE=github.com/blaktron/*"
            echo "GIT_CONFIG_GLOBAL=$RUNNER_TEMP/gitconfig"
          } >> "$GITHUB_ENV"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      # The private blaktron modules need a credential to fetch. On this
      # persistent host it must not land in ~/.gitconfig, so the rewrite goes
      # into a job-scoped file (GIT_CONFIG_GLOBAL above) removed at the end.
      - name: Authenticate for the private blaktron modules (job-scoped)
        env:
          AGENTRY_BUILD_TOKEN: ${{ secrets.AGENTRY_BUILD_TOKEN }}
        run: |
          git config --file "$GIT_CONFIG_GLOBAL" url."https://x-access-token:${AGENTRY_BUILD_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: Install the wails CLI at the version go.mod pins
        run: go install "github.com/wailsapp/wails/v2/cmd/wails@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"
      # -skipbindings: the checked-in bindings are what the check job
      # type-checks and the drift step keeps current; a build never
      # regenerates them (desktop#97). -m: skip wails' own go mod tidy.
      # Derived once and passed to every step below, the way the release
      # workflow derives it once in preflight and for the same reason: a wails
      # build rewrites tracked files (frontend/package.json.md5 and the
      # runtime bindings), so the tree is dirty by the time the next step
      # runs, and a second `git describe` would say <sha>-dirty where the
      # first said <sha> — two names for one build, and the second step
      # looking for a file the first did not write.
      - name: The version this job names its artifacts for
        run: echo "VERSION=$(make -s version)" >> "$GITHUB_ENV"
      # package-darwin builds the bundle, the zip and the dmg, and reads the
      # dmg back (scripts/check-darwin-dmg.sh); this job is where that runs
      # on every change, since the Mac is the only host that can mount one.
      - name: Build the universal bundle, its zip and its dmg
        run: |
          make package-darwin VERSION="$VERSION" WAILS_FLAGS='-m -skipbindings'
          lipo -info build/bin/agentry-desktop.app/Contents/MacOS/agentry-desktop
          shasum -a 256 build/bin/*.zip build/bin/*.dmg
      # The dmg's promise about an upgrade: dragging the bundle over a copy
      # already there leaves the settings, the installed agents, the pinned
      # key, the runner policy and a keychain item byte-identical, and the
      # bundle installed from the image launches where a console session
      # allows it (agentry-desktop#85, plan §8).
      - name: Install-over-install smoke of the dmg
        run: make smoke-darwin-dmg VERSION="$VERSION"
      # The bundle swap and what survives it (agentry-desktop#88).
      - name: Self-update bundle-swap acceptance
        run: make smoke-darwin-selfupdate VERSION="$VERSION"
      # frontend/dist exists after the wails build, so the Go tools run on the
      # embedded bundle the app ships with.
      - name: Go tests, natively on macOS
        run: go test ./...
      # go-keyring (v0.2.8) runs /usr/bin/security with no keychain named, so
      # it writes to the user's DEFAULT keychain and reads through the search
      # list. The runner's user has no console session and so has neither
      # (security's exit 152, agentry-desktop#106). The job gives it both for
      # the length of the round trip: a throwaway keychain in RUNNER_TEMP, with
      # a random password that lives only in this step, holding nothing but
      # the test's own item. Both settings live in the user's
      # com.apple.security preferences, so that domain is snapshotted here and
      # put back exactly by the always() step after the round trip (or deleted,
      # when it did not exist). A killed job cannot run that step, so an
      # agentry-ci keychain still named here is a leftover: it is removed
      # before the snapshot, never saved as the state to restore.
      - name: A throwaway keychain as the default, for the round trip
        run: |
          kc="$RUNNER_TEMP/agentry-ci.keychain-db"
          keychains() { security list-keychains -d user | sed -e 's/^ *"//' -e 's/"$//' | grep -v '^$' || true; }
          if keychains | grep 'agentry-ci\.keychain' >/dev/null || security default-keychain -d user 2>/dev/null | grep 'agentry-ci\.keychain' >/dev/null; then
            echo "::warning::a killed job left an agentry-ci keychain in $(id -un)'s settings; removing it before the snapshot"
            keep=(); while IFS= read -r k; do case "$k" in *agentry-ci.keychain*) ;; *) keep+=("$k") ;; esac; done < <(keychains)
            if [ ${#keep[@]} -eq 0 ]; then defaults delete com.apple.security 2>/dev/null || true
            else security list-keychains -d user -s "${keep[@]}"; security default-keychain -d user -s "${keep[0]}"; fi
          fi
          if defaults read com.apple.security >/dev/null 2>&1; then
            defaults export com.apple.security "$RUNNER_TEMP/security-prefs.plist"; echo "snapshot: com.apple.security exported"
          else touch "$RUNNER_TEMP/security-prefs.absent"; echo "snapshot: no com.apple.security domain for $(id -un)"; fi
          echo "search list before: [$(keychains | tr '\n' ' ')] default: [$(security default-keychain -d user 2>/dev/null | sed 's/^ *//')]"
          pw=$(openssl rand -hex 24)
          echo "::add-mask::$pw"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings "$kc"
          security unlock-keychain -p "$pw" "$kc"
          security list-keychains -d user -s "$kc"
          security default-keychain -d user -s "$kc"
          echo "search list now: [$(keychains | tr '\n' ' ')]"
      # -count=1: the Mac keeps its Go build cache, and a cached pass is not a
      # round trip through this job's keychain.
      - name: Keychain round trip
        run: AGENTRY_KEYCHAIN_TEST=1 go test ./internal/settings/ -run TestKeychainRoundTrip -v -count=1
      # Runs whatever happened above. Every command is attempted and a failure
      # is remembered rather than ending the step, so the keychain is always
      # deleted; the end checks, with security itself, that nothing of it is
      # left in the user's settings.
      - name: Restore the keychain settings and delete the throwaway
        if: always()
        run: |
          kc="$RUNNER_TEMP/agentry-ci.keychain-db"; rc=0
          if [ -f "$RUNNER_TEMP/security-prefs.plist" ]; then defaults import com.apple.security "$RUNNER_TEMP/security-prefs.plist" || rc=1
          elif [ -f "$RUNNER_TEMP/security-prefs.absent" ]; then defaults delete com.apple.security 2>/dev/null || true; fi
          security delete-keychain "$kc" 2>/dev/null || true
          list=$(security list-keychains -d user | sed -e 's/^ *"//' -e 's/"$//' | grep -v '^$' || true)
          dflt=$(security default-keychain -d user 2>/dev/null | sed 's/^ *//' || true)
          echo "search list after: [$(printf '%s' "$list" | tr '\n' ' ')] default: [$dflt]"
          case "$list$dflt" in *agentry-ci.keychain*) echo "::error::$(id -un)'s keychain settings still name the throwaway keychain"; rc=1 ;; esac
          if [ -e "$kc" ]; then echo "::error::the throwaway keychain file is still at $kc"; rc=1; fi
          exit $rc
      # A window needs the runner's user logged in at the console. Without a
      # session the smoke cannot run and says so; with one, the built app must
      # still be running after five seconds.
      - name: Launch smoke
        run: |
          if ! launchctl print "gui/$(id -u)" >/dev/null 2>&1; then
            echo "::warning::launch smoke skipped: no console session for $(id -un) on this runner"
            exit 0
          fi
          ./build/bin/agentry-desktop.app/Contents/MacOS/agentry-desktop >smoke.log 2>&1 & pid=$!
          sleep 5
          if kill -0 "$pid" 2>/dev/null; then
            echo "agentry-desktop running after 5 s"; kill "$pid"; wait "$pid" 2>/dev/null || true
          else
            wait "$pid"; ec=$?; echo "agentry-desktop exited with $ec before 5 s"; tail -20 smoke.log; exit 1
          fi
      # No upload-artifact (agentry-desktop#187, #188): a smoke that goes red
      # is exactly when someone wants the image to look at, so a failed job's
      # zip and dmg stay on the Mac for 7 days, in ~/runner-artifacts of the
      # runner's user; the step names the path. A green build keeps nothing.
      - name: Keep a failed build on the Mac
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: scripts/ci-keep-build.sh "$JOB_STATUS" build/bin/agentry-desktop-*-darwin-universal.zip build/bin/agentry-desktop-*-darwin-universal.dmg
      - name: Remove the job-scoped git credential
        if: always()
        run: rm -f "$GIT_CONFIG_GLOBAL"
