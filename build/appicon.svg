<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- The desktop's app icon (agentry-desktop#367): the Agentry mark — the
       faceted shield with the delta A, the same geometry as the site's
       lib/brand-mark.ts — on a paper tile laid out on macOS's icon grid
       (an 824-unit tile inset 100, with its shadow). `make app-icons`
       renders build/appicon.png, build/windows/icon.ico and the Linux
       hicolor sizes from this file and build/appicon-small.svg. -->
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="10" result="blur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#faf6ee" filter="url(#shadow)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#231b12" stroke-opacity="0.08"/>
  <g transform="translate(181 171) scale(13.793)">
    <path d="M24 3 41 10.5 V 23 C 41 34.5 34 42.5 24 46.5 C 14 42.5 7 34.5 7 23 V 10.5 Z" fill="#0e7a63"/>
    <path d="M24 3 41 10.5 V 23 C 41 34.5 34 42.5 24 46.5 Z" fill="#000" fill-opacity="0.22"/>
    <path d="M24 9.5 L35 38 Q29.5 32 24 32 Q18.5 32 13 38 Z M24 19.2 L27.2 27.4 H20.8 Z" fill="#faf6ee" fill-rule="evenodd"/>
  </g>
</svg>
