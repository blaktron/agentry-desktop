  - id: windows-desktop
    application: "Windows desktop"
    category: "Your computer"
    summary: "Let an agent see and operate your Windows desktop: windows, clicks, typing, files, shell."
    platforms: [windows]
    server:
      ecosystem: pypi
      name: "windows-mcp"
      version: "0.8.8"
      source: https://github.com/CursorTouch/Windows-MCP
    attachment: stdio
    launch:
      command: ["uvx", "windows-mcp==0.8.8", "serve"]
      env:
        ANONYMIZED_TELEMETRY: "false"
    tools:
      - {name: ControlStatus, class: read}
      - {name: DisplayInventory, class: read}
      - {name: Wait, class: read}
      - {name: WaitFor, class: read}
      - {name: Scrape, class: read, egress: true}
      - {name: Snapshot, class: read}
      - {name: Screenshot, class: read}
      - {name: App, class: act}
      - {name: Clipboard, class: act}
      - {name: FileSystem, class: act}
      - {name: Click, class: act}
      - {name: Type, class: act}
      - {name: Scroll, class: act}
      - {name: Move, class: act}
      - {name: Shortcut, class: act}
      - {name: MultiSelect, class: act}
      - {name: MultiEdit, class: act}
      - {name: Notification, class: act}
      - {name: Process, class: exec}
    withheld: [PowerShell, Registry]
    steps:
      - "Install uv, which runs the server: https://docs.astral.sh/uv/"
      - "Windows-MCP needs Python 3.14, which uv fetches on its own the first time it runs."
      - "Sign in to an interactive Windows session; the server controls whatever is on that desktop, so close anything you do not want an agent to touch."
    windows:
      windows: ["explorer.exe"]
    installed:
      windows: ["C:\\Windows\\explorer.exe"]
    envNotes:
      ANONYMIZED_TELEMETRY: "Set to false so the server sends no usage statistics."
  - id: macos-automation
    application: "macOS (AppleScript and JXA)"
