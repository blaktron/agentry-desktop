    steps:
      - "Install Node.js, which runs the server: https://nodejs.org/"
      - "Install InDesign 2023 or later and open it."
      - "On macOS, allow your terminal or MCP client to control InDesign when macOS asks (System Settings, Privacy and Security, Automation)."
      - "To let agents read and write other folders, add the variable INDESIGN_ALLOWED_DIRS with Edit on its card once it is on your list: the folders, separated by : on macOS and ; on Windows. On macOS with more than one InDesign installed, add INDESIGN_APP_NAME, the exact app name (for example Adobe InDesign 2026), to pick one; otherwise the newest is used."
    windows:
      darwin: ["com.adobe.InDesign", "Adobe InDesign 2026", "Adobe InDesign 2025"]
      windows: ["InDesign.exe"]
    installed:
      darwin: ["/Applications/Adobe InDesign 2026/Adobe InDesign 2026.app", "/Applications/Adobe InDesign 2025/Adobe InDesign 2025.app"]
      windows: ["C:\\Program Files\\Adobe\\Adobe InDesign 2026\\InDesign.exe", "C:\\Program Files\\Adobe\\Adobe InDesign 2025\\InDesign.exe"]
  - id: premiere-pro
    application: "Adobe Premiere Pro"
    category: "Video"
    summary: "Inspect projects and edit timelines in a running Premiere Pro."
    platforms: [darwin, windows]
    server:
      ecosystem: npm
      name: "premiere-pro-mcp"
      version: "1.30.0"
      source: https://github.com/leancoderkavy/premiere-pro-mcp
    attachment: stdio
    launch:
      command: ["npx", "-y", "premiere-pro-mcp@1.30.0"]
    tools:
      - {name: verify_premiere_connection, class: read}
      - {name: get_capabilities, class: read}
      - {name: ping, class: read}
      - {name: get_project_info, class: read}
      - {name: get_active_sequence, class: read}
      - {name: list_project_items, class: read}
      - {name: get_premiere_state, class: read}
      - {name: save_project, class: act}
      - {name: import_media, class: act}
      - {name: create_bin, class: act}
      - {name: add_to_timeline, class: act}
      - {name: ripple_delete, class: act}
      - {name: export_sequence, class: act}
      - {name: execute_extendscript, class: exec}
      - {name: evaluate_expression, class: exec}
    steps:
      - "Install Node.js, which runs the server: https://nodejs.org/"
      - "For Premiere 25.6 or later, install the UXP connector (.ccx) from the project's release page, choose a secret of at least 16 characters, enter it in the connector panel, and add it as the variable PREMIERE_UXP_TOKEN with Edit on its card once it is on your list."
      - "For older versions, or tools the UXP connector lacks, run npx -y premiere-pro-mcp@1.30.0 --install-cep once to install the CEP panel, then restart Premiere Pro."
      - "Open a project in Premiere Pro, open the MCP for Adobe Premiere Pro panel (Window menu), and ask an agent to run verify_premiere_connection."
    windows:
      darwin: ["com.adobe.PremierePro.26", "com.adobe.PremierePro.25", "Adobe Premiere Pro 2026"]
      windows: ["Adobe Premiere Pro.exe"]
    installed:
      darwin: ["/Applications/Adobe Premiere Pro 2026/Adobe Premiere Pro 2026.app", "/Applications/Adobe Premiere Pro 2025/Adobe Premiere Pro 2025.app"]
      windows: ["C:\\Program Files\\Adobe\\Adobe Premiere Pro 2026\\Adobe Premiere Pro.exe", "C:\\Program Files\\Adobe\\Adobe Premiere Pro 2025\\Adobe Premiere Pro.exe"]
  - id: after-effects
    application: "Adobe After Effects"
    category: "Video"
    summary: "Create comps, animate layers and render in a running After Effects."
    platforms: [darwin, windows]
    server:
      ecosystem: npm
      name: "after-effects-mcp"
      version: "1.13.0"
      source: https://github.com/a-y-ibrahim/after-effects-mcp
    attachment: stdio
    launch:
      command: ["npx", "-y", "after-effects-mcp@1.13.0"]
    tools:
      - {name: run-script, class: exec}
      - {name: get-results, class: read}
      - {name: get-help, class: read}
      - {name: create-composition, class: act}
      - {name: create-adjustment-layer, class: act}
